       <button class="btn primary" data-act="fechar">${ico('check')} Fechar ${mesNome}</button>`)
    + `<div class="kpis">
        ${kpi('Arrecadação', brl(c.arrec), `${S.ganhos.length} ${S.ganhos.length === 1 ? 'fonte' : 'fontes'} de renda fixa`, 'up', {cls:'pos'})}
        ${kpi('Resultado primário', brl(c.primario), `${pct(c.arrec ? c.primario / c.arrec * 100 : 0)} da arrecadação`, 'spark', {cls:sg(c.primario)})}
        ${kpi('Superávit nominal', brl(c.superavit), `depois de ${brl(c.totalFundos)} em fundos`, 'down', {cls:sg(c.superavit)})}
        ${kpi('Total em caixa', brl(c.totalCaixa), 'superávit + extras − gastos', 'wallet', {hero:true, cls:sg(c.totalCaixa)})}
      </div>
      <div class="grid g-1-2">${ganhos}${fixos}</div>
      ${fundos}
      <div class="grid g-2-1">${caixa}${resumo}</div>
      <p class="hint">Nos pares R$ / %, o valor em branco é o que você digitou e fica fixo; o cinza é calculado. Os campos de valor aceitam contas, como <code>5,10*23</code>.</p>`;
}

/* ============================================================
   Aba: Contas do mês (só leitura)
   Lista objetiva do que sai no mês: impostos, gastos fixos e a fatura de cada cartão.
   Em cada mês paga-se a fatura daquele mês, que reúne as compras feitas até o fechamento (na prática, as do mês anterior).
   ============================================================ */
function vContas(){
  const off = Math.max(0, Math.min(12, Number(S.ui.contasOff) || 0));
  const mes = addMonths(S.config.mesAtual, off), mesAnt = addMonths(mes, -1);
  const nomeMes = MESES_L[+mes.slice(5) - 1].toLowerCase(), nomeAnt = MESES_L[+mesAnt.slice(5) - 1].toLowerCase();
  const c = calc(mes), hoje = hojeISO();
  const marcas = (S.contasPagas && S.contasPagas[mes]) || {};   // checklist do mês: chave -> true/false
  const impostos = c.fixos.filter(f => f.it.imposto && f.it.auto !== 'divida' && f.v > 0);
  const fixos = c.fixos.filter(f => !f.it.imposto && f.it.auto !== 'divida' && f.v > 0);
  const gastosCaixa = off === 0 ? c.caixa.filter(x => x.it.tipo === 'gasto' && x.v > 0) : [];
  // faturas pagas neste mês, por cartão; depois do vencimento contam como pagas, a não ser que você desmarque
  const faturas = S.cartoes.map(k => {
    const fat = faturaPagaEm(k, mes), venc = vencimentoISO(k.id, fat), ex = marcas['cartao:' + k.id];
    return {k, fat, venc, venceu: hoje >= venc, pago: ex != null ? ex : hoje >= venc, auto: ex == null && hoje >= venc,
            itens: S.parcelas.filter(p => p.cartaoId === k.id && pagamentoEm(p, fat) > 0), total: totalDivida(fat, k.id)};
  }).filter(f => f.total > 0);
  const semCartao = S.parcelas.filter(p => !S.cartoes.some(k => k.id === p.cartaoId) && pagamentoEm(p, mes) > 0);

  // todas as contas do mês, com chave do checklist
  const pg = key => !!marcas[key];
  const itens = [
    ...impostos.map(f => ({v: f.v, pago: pg('fx:' + f.it.id)})),
    ...fixos.map(f => ({v: f.v, pago: pg('fx:' + f.it.id)})),
    ...faturas.map(f => ({v: f.total, pago: f.pago})),
    ...semCartao.map(p => ({v: pagamentoEm(p, mes), pago: pg('parc:' + p.id)})),
    ...gastosCaixa.map(x => ({v: x.v, pago: pg('cx:' + x.it.id)})),
  ];
  const tImp = sum(impostos.map(f => f.v)), tFix = sum(fixos.map(f => f.v));
  const tFat = sum(faturas.map(f => f.total)) + sum(semCartao.map(p => pagamentoEm(p, mes)));
  const tCx = sum(gastosCaixa.map(x => x.v)), total = tImp + tFix + tFat + tCx;
  const pago = sum(itens.filter(i => i.pago).map(i => i.v)), falta = total - pago, nPagos = itens.filter(i => i.pago).length;

  const ck = (key, on, dica = '') => `<button type="button" class="ck${on ? ' on' : ''}" data-act="pago" data-arg="${mes}|${key}" aria-pressed="${on}"
      data-tip="${esc(tipHTML(dica || (on ? 'Pago' : 'Marcar como pago'), [[on ? 'Clique para desmarcar' : 'Clique quando pagar', '']]))}">${ico('check')}</button>`;
  const linhaCk = (key, nome, valor, sub = '') => { const on = pg(key); return `<div class="cl${on ? ' pago' : ''}">${ck(key, on)}<span class="cl-n">${nome}${sub ? `<small>${sub}</small>` : ''}</span><span class="cl-v">${brl(valor)}</span></div>`; };
  const linha = (nome, valor, sub = '') => `<div class="cl"><span class="cl-n">${nome}${sub ? `<small>${sub}</small>` : ''}</span><span class="cl-v">${brl(valor)}</span></div>`;
  const secao = (titulo, tot, corpo, nota = '') => `<section class="cs"><div class="cs-h"><h3>${titulo}</h3><span>${brl(tot)}</span></div>${nota ? `<p class="hint" style="margin:-2px 0 8px">${nota}</p>` : ''}${corpo}</section>`;
  const qualParcela = (p, fat = mes) => {
    if (!p.ultima) return 'recorrente';
    const cr = cron(p), m = cr.meses[fat] || {}, pagas = cr.n - (m.antes || 0);
    return m.qtd > 1 ? `parcelas ${pagas + 1}–${pagas + m.qtd} de ${cr.n}` : `parcela ${pagas + 1} de ${cr.n}`;
  };
  const blocoFatura = f => `<details class="cl-fat${f.pago ? ' pago' : ''}">
      <summary>${ck('cartao:' + f.k.id, f.pago, f.auto ? `Paga: venceu ${dataBR(f.venc).slice(0, 5)}` : '')}<span class="cl-n"><span class="dotc" style="--c:${esc(f.k.cor)};margin-right:8px"></span>${esc(f.k.nome)}<small>${f.itens.length} ${f.itens.length === 1 ? 'parcela' : 'parcelas'} · fatura de ${mesAbrev(f.fat)} · ${f.venceu ? `venceu ${dataBR(f.venc).slice(0, 5)}` : `vence ${dataBR(f.venc).slice(0, 5)}`}</small></span><span class="cl-v">${brl(f.total)}</span></summary>
      <div class="cl-sub">${f.itens.sort((a, b) => pagamentoEm(b, f.fat) - pagamentoEm(a, f.fat)).map(p => linha(esc(p.nome), pagamentoEm(p, f.fat), qualParcela(p, f.fat))).join('')}</div>
    </details>`;
  const seta = (dir, off0) => `<button class="navbtn" data-act="contasMes" data-arg="${dir}" title="${dir < 0 ? 'Mês anterior' : 'Próximo mês'}"${off0 ? ' disabled style="opacity:.35;cursor:default"' : ''}>${ico(dir < 0 ? 'left' : 'right').replace('<svg', '<svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2"')}</button>`;

  return pageHead('Contas do mês', `${MESES_L[+mes.slice(5) - 1]} de ${mes.slice(0, 4)}`,
      `${seta(-1, off === 0)}<span class="pill">${off === 0 ? 'Mês em edição' : `Prévia · ${off} ${off === 1 ? 'mês' : 'meses'} à frente`}</span>${seta(1, off >= 12)}`)
    + `<div class="aviso-fatura">${ico('contas')}<div><b>Em ${nomeMes} você paga as faturas de ${nomeMes}.</b> Elas reúnem as compras feitas até o fechamento de cada cartão, ou seja, na prática as compras de ${nomeAnt}${S.cartoes.some(k => k.fechamento) ? ` (${S.cartoes.filter(k => k.fechamento).map(k => `${esc(k.nome)} fecha dia ${k.fechamento}`).join(', ')})` : ''}.</div></div>
      <div class="kpis">
        ${kpi('Falta pagar', brl(falta), `${nPagos} de ${itens.length} contas pagas`, 'contas', {hero:true, cls: falta <= 0.005 && itens.length ? 'pos' : ''})}
        ${kpi('Já pago', brl(pago), total ? `${pct(pago / total * 100)} do mês` : 'nada a pagar', 'check', {cls: pago > 0 ? 'pos' : ''})}
        ${kpi('Total do mês', brl(total), `impostos ${brl0(tImp)} · fixos ${brl0(tFix)}`, 'wallet')}
        ${kpi('Faturas dos cartões', brl(tFat), `faturas de ${mesAbrev(mes)}`, 'divida')}
      </div>
      <section class="card contas">
        ${secao('Impostos', tImp, impostos.map(f => linhaCk('fx:' + f.it.id, esc(f.it.nome), f.v, f.it.modo === 'pct' ? `${pct(f.p)} ${f.it.base === 'acima' ? 'da base após os itens acima' : 'da arrecadação'}` : '')).join('') || '<p class="muted">Nenhum imposto no Orçamento.</p>')}
        ${secao('Gastos fixos', tFix, fixos.map(f => linhaCk('fx:' + f.it.id, esc(f.it.nome), f.v)).join('') || '<p class="muted">Nenhum gasto fixo no Orçamento.</p>')}
        ${secao('Faturas dos cartões', tFat, (faturas.map(blocoFatura).join('') + semCartao.map(p => linhaCk('parc:' + p.id, esc(p.nome), pagamentoEm(p, mes), 'sem cartão · ' + qualParcela(p))).join('')) || `<p class="muted">Nenhuma parcela nas faturas de ${mesAbrev(mes)}.</p>`,
            `Faturas que vencem em ${nomeMes}. Depois do vencimento, a fatura já aparece como paga (desmarque se não pagou). Clique num cartão para ver as parcelas.`)}
        ${gastosCaixa.length ? secao('Gastos não fixos lançados', tCx, gastosCaixa.map(x => linhaCk('cx:' + x.it.id, esc(x.it.nome), x.v)).join('')) : ''}
        <div class="cs-tot"><span>Falta pagar em ${nomeMes}</span><span class="${falta <= 0.005 && itens.length ? 'pos' : ''}">${brl(falta)}</span></div>
        <div style="margin-top:8px">${meter(total ? pago / total : 0, true)}<div class="mt">${brl(pago)} pagos de ${brl(total)} · ${nPagos} de ${itens.length} contas</div></div>
      </section>
      <p class="hint" style="margin-top:14px">Use ✓ para marcar o que já pagou. Os valores são só para consulta: para mudá-los, use
        <button class="lnk" data-act="tab" data-arg="orcamento">Orçamento</button> (impostos e gastos fixos) ou
        <button class="lnk" data-act="tab" data-arg="divida">Dívida</button> (parcelas e cartões).</p>`;
}

/* ============================================================
   Aba: Dívida
   ============================================================ */
function vDivida(){
  const c = calc(), mes = c.mes, modo = S.ui.dividaModo;
  const montante = p => modo === 'mes' ? pagamentoEm(p, mes) : saldoParcelaEm(p, mes);
  const ativas = parcelasAtivas(mes);
  const corTipo = t => t ? (S.tiposCor[t] || '#7c85ad') : '#5d6584';

  const porTipo = {};
  ativas.forEach(p => { const k = p.tipo || 'Sem tipo'; porTipo[k] = (porTipo[k] || 0) + montante(p); });
  const itTipo = Object.entries(porTipo).map(([k, v]) => ({label:k, valor:v, cor:corTipo(k === 'Sem tipo' ? '' : k)})).sort((a, b) => b.valor - a.valor);
  const itCartao = S.cartoes.map(k => ({label:k.nome, valor:sum(ativas.filter(p => p.cartaoId === k.id).map(montante)), cor:k.cor})).filter(i => i.valor > 0);
  const totMont = sum(itTipo.map(i => i.valor));
  const livre = c.teto - c.usado;
  /* situação: "3 de 12" + quantas faltam; antes do início, quando começa; depois do fim, quitada */
  const restam = p => {
    if (!p.ultima) return '<span class="muted">contínua</span>';
    if (p.inicio && mes < p.inicio) return `<span class="muted">começa em ${mesCurto(p.inicio)}</span>`;
    const cr = cron(p), n = restantesEm(p, mes);
    if (n === 0) return '<span class="muted">quitada</span>';
    const atual = cr.n - n + 1, mm = cr.meses[mes] || {}, pagaMes = mm.qtd > 0 && pagaAuto(p, mes);
    const sub = pagaMes ? `<span class="pos">✓ paga</span> · faltam ${n - mm.qtd}` : n === 1 ? 'última' : `faltam ${n}`;
    return `<b>${atual}</b><span class="muted"> de ${cr.n}</span><div class="sub2" style="padding:0">${sub}${cr.antecipado ? ` · termina ${mesAbrev(cr.fim)}` : ''}</div>`;
  };
  /* mini calendário: a linha da parcela vira uma faixa com os meses do parcelamento e quantas parcelas foram pagas em cada um */
  /* "extra": no celular o botão Recorrente mora aqui, ao lado de Meses (no PC fica junto do término) */
  const btnCal = (p, extra = '') => `<div class="antctl">${p.ultima ? `<button type="button" class="recbtn" data-act="cal" data-id="${p.id}"
      data-tip="${esc(tipHTML('Meses do parcelamento', [['Parcelas pagas em cada mês', ''], ['2 ou mais = antecipação', '']]))}">▦ Meses</button>` : ''}${extra}</div>`;
  const recBtn = (p, cls) => `<button type="button" class="recbtn ${cls}${p.ultima ? '' : ' on'}" data-act="rec" data-id="${p.id}" data-tip="${esc(tipHTML(p.ultima ? 'Tornar recorrente' : 'Recorrente', [[p.ultima ? 'Despesa sem data para acabar' : 'Clique para voltar a ter data de fim', '']]))}">↻ Recorrente</button>`;
  const linhaCal = (p, cols) => {
    const cr = cron(p);
    const cells = cr.lista.map(k => {
      const m = cr.meses[k], estado = k < mes ? (m.mostra === 0 ? 'falta' : 'pago') : k === mes ? 'atual' : 'futuro';
      return `<div class="mc ${estado}${m.mostra > 1 ? ' extra' : ''}" data-tip="${esc(tipHTML(mesLabel(k), [['Parcelas pagas no mês', String(m.mostra)], ['Faltavam no início do mês', String(m.antes)], ['Faltam depois', String(m.depois)]]))}">
        <span>${mesAbrev(k)}</span><input class="f mcq" type="text" inputmode="numeric" data-set="pagas:${p.id}:${k}" value="${m.mostra}"></div>`;
    }).join('');
    return `<tr class="calrow">
      <td class="tit">${inTxt(`parcelas:${p.id}:nome`, p.nome, 'Nome da parcela')}<div class="sub2">${brl(p.valor)} × ${cr.n}${cr.antecipado ? ` · termina ${mesAbrev(cr.fim)}` : cr.atrasado ? ` · vai até ${mesAbrev(cr.fim)}` : ''}</div></td>
      <td colspan="${cols - 2}" style="max-width:0"><div class="mcal">${cells}</div></td>
      <td class="ctl"><button type="button" class="recbtn on" data-act="cal" data-id="${p.id}" title="Voltar para a linha normal">▦ Fechar</button></td></tr>`;
  };
  const camposParc = p => {
    const fx = p.fixos || ['ultima', 'inicio'], calc = ['inicio', 'nParc', 'ultima'].find(f => !fx.includes(f));
    return f => calc === f ? 'calc' : 'lock';
  };
  const cartaoOpts = sel => S.cartoes.map(k => `<option value="${k.id}"${k.id === sel ? ' selected' : ''}>${esc(k.nome)}</option>`).join('');
  const fimOrd = p => p.ultima ? fimReal(p) : '9999';
  const ordem = (a, b) => (fimOrd(a) > fimOrd(b)) - (fimOrd(a) < fimOrd(b));

  /* quitado = a última parcela é anterior ao mês em edição; vai sozinho para a janela de quitados */
  const quitada = p => !!p.ultima && (fimReal(p) < mes || pagaAuto(p, fimReal(p)));   // última parcela paga: vai para os quitados
  const linhas = lista => lista.filter(p => !quitada(p)).sort(ordem).map(p => { if (p.ultima && S.ui.cal[p.id]) return linhaCal(p, 9); const st = camposParc(p); return `
      <tr class="${!p.ultima ? 'rec' : ''}">
        <td class="tit">${inTxt(`parcelas:${p.id}:nome`, p.nome, 'Nome da parcela')}</td>
        <td style="width:170px"><div class="dotcell"><span class="dotc" style="--c:${esc(corTipo(p.tipo))}"></span>${inTxt(`parcelas:${p.id}:tipo`, p.tipo, 'Tipo', '', 'list="tiposList"')}</div></td>
        <td class="r">${inNum(`parcelas:${p.id}:valor`, p.valor, {cls:'lock'})}</td>
        <td style="width:100px"${p.dataCompra ? ` data-tip="${esc(dicaCompra(p))}"` : ''}>${inMes(`parcelas:${p.id}:inicio`, p.inicio, {cls: p.ultima ? st('inicio') : 'lock', compra: p.dataCompra, cartao: S.cartoes.find(x => x.id === p.cartaoId) || {nome:'Cartão'}})}</td>
        <td class="r" style="width:84px">${p.ultima ? `<input class="f num ${st('nParc')}" type="text" inputmode="numeric" data-set="parcelas:${p.id}:nParc" value="${p.nParc ? Math.round(p.nParc) + 'x' : ''}" style="width:70px">` : '<span class="muted" style="padding-right:10px">—</span>'}</td>
        <td style="width:220px"><div class="ultcell">
          ${p.ultima ? inMes(`parcelas:${p.id}:ultima`, p.ultima, {cls: st('ultima')}) : '<span class="recfim">Sem data de fim</span>'}
          ${recBtn(p, 'so-pc')}
        </div></td>
        <td style="white-space:nowrap"><div class="sitv">${restam(p)}</div>${btnCal(p, recBtn(p, 'so-cel'))}</td>
        <td style="width:130px"><select class="f" data-set="parcelas:${p.id}:cartaoId">${cartaoOpts(p.cartaoId)}</select></td>
        ${acts('parcelas', p.id, {ord:false})}</tr>`; }).join('');

  const cabParc = '<thead><tr><th>Parcela</th><th>Tipo</th><th class="r">Valor/mês</th><th>Início</th><th class="r">Parcelas</th><th>Término</th><th>Situação</th><th>Cartão</th><th></th></tr></thead>';
  const blocoCartao = k => {
    const lista = S.parcelas.filter(p => p.cartaoId === k.id);
    return `<section class="card mb" style="border-left:4px solid ${esc(k.cor)}">
      <div class="ch">
        <h2 style="text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)">
          <input type="color" class="sw" data-set="cartoes:${k.id}:cor" value="${esc(k.cor)}" title="Cor do cartão">
          <input class="f name" type="text" data-set="cartoes:${k.id}:nome" value="${esc(k.nome)}" style="font-size:15px;font-weight:800;width:200px">
          <span class="fech" data-tip="${esc(tipHTML('Dia de fechamento da fatura', [['Compras a partir deste dia', 'vão para a fatura seguinte']]))}">fecha dia ${inNum(`cartoes:${k.id}:fechamento`, k.fechamento, {cls:'lock', fmt: x => x ? String(Math.round(x)) : ''})}</span>
          <span class="fech" data-tip="${esc(tipHTML('Dia de vencimento da fatura', [['Depois dele, a parcela do mês', 'conta como paga']]))}">vence dia ${inNum(`cartoes:${k.id}:vencimento`, k.vencimento, {cls:'lock', fmt: x => x ? String(Math.round(x)) : ''})}</span>
        </h2>
        <div style="display:flex;align-items:center;gap:12px"><span class="muted">no mês</span><span class="tot">${brl(totalDivida(mes, k.id))}</span>
          <button class="ib del" data-act="del" data-col="cartoes" data-id="${k.id}" title="Remover cartão">✕</button></div>
      </div>
      <div class="tw"><table class="parc">
        ${cabParc}
        <tbody>${linhas(lista) || '<tr><td colspan="9" class="muted" style="padding:12px 8px">Nenhuma parcela ativa.</td></tr>'}</tbody>
      </table></div>
      <div class="cf"><button class="btn ghost" data-act="add" data-col="parcelas" data-arg="${k.id}">${ico('plus')} Parcela</button></div>
    </section>`;
  };
  const orfas = S.parcelas.filter(p => !S.cartoes.some(k => k.id === p.cartaoId));
  const libera = {};
  S.parcelas.filter(p => p.ultima && fimReal(p) >= mes).forEach(p => { const f = fimReal(p); libera[f] = (libera[f] || 0) + (Number(p.valor) || 0); });
  const quit = Object.keys(libera).sort();
  const tipoCount = t => S.parcelas.filter(p => p.tipo === t).length;
  const tituloModo = modo === 'mes' ? 'NO MÊS' : 'SALDO';

  // janela de parcelamentos quitados (histórico): mais recentes primeiro
  const quitados = S.parcelas.filter(quitada).sort((a, b) => (fimReal(b) > fimReal(a)) - (fimReal(b) < fimReal(a)));
  const totalPago = p => cron(p).pago;
  const corCartao = id => (S.cartoes.find(k => k.id === id) || {}).cor || '#5d6584';
  const linhasQuit = quitados.map(p => { if (S.ui.cal[p.id]) return linhaCal(p, 9); const st = camposParc(p); return `<tr>
      <td class="tit">${inTxt(`parcelas:${p.id}:nome`, p.nome, 'Nome do parcelamento')}</td>
      <td style="width:170px"><div class="dotcell"><span class="dotc" style="--c:${esc(corTipo(p.tipo))}"></span>${inTxt(`parcelas:${p.id}:tipo`, p.tipo, 'Tipo', '', 'list="tiposList"')}</div></td>
      <td style="width:140px"><div class="dotcell"><span class="dotc" style="--c:${esc(corCartao(p.cartaoId))}"></span><select class="f" data-set="parcelas:${p.id}:cartaoId">${cartaoOpts(p.cartaoId)}</select></div></td>
      <td class="r">${inNum(`parcelas:${p.id}:valor`, p.valor, {cls:'lock'})}</td>
      <td style="width:100px"${p.dataCompra ? ` data-tip="${esc(dicaCompra(p))}"` : ''}>${inMes(`parcelas:${p.id}:inicio`, p.inicio, {cls: st('inicio'), compra: p.dataCompra, cartao: S.cartoes.find(x => x.id === p.cartaoId) || {nome:'Cartão'}})}</td>
      <td class="r" style="width:84px"><input class="f num ${st('nParc')}" type="text" inputmode="numeric" data-set="parcelas:${p.id}:nParc" value="${p.nParc ? Math.round(p.nParc) + 'x' : ''}" style="width:70px"></td>
      <td style="width:100px">${inMes(`parcelas:${p.id}:ultima`, p.ultima, {cls: st('ultima')})}${cron(p).antecipado ? `<div class="sub2" style="color:#b4b6ff">quitado em ${mesAbrev(cron(p).fim)}</div>` : ''}</td>
      <td class="r v" style="font-weight:700">${brl(totalPago(p))}${btnCal(p)}</td>
      ${acts('parcelas', p.id, {ord:false})}</tr>`; }).join('');
  const cardQuit = card('Parcelamentos quitados', `
      <div class="tw"><table>
        <thead><tr><th>Parcelamento</th><th>Tipo</th><th>Cartão</th><th class="r">Valor/mês</th><th>Início</th><th class="r">Parcelas</th><th>Término</th><th class="r">Total pago</th><th></th></tr></thead>
        <tbody>${linhasQuit || `<tr><td colspan="9" class="muted" style="padding:12px 8px">Nenhum parcelamento quitado ainda. Quando a última parcela de uma compra passar, ela aparece aqui.</td></tr>`}</tbody>
      </table></div>`,
    {right: quitados.length ? `<span class="muted" style="margin-right:12px">${quitados.length} ${quitados.length === 1 ? 'parcelamento' : 'parcelamentos'}</span><span class="tot">${brl(sum(quitados.map(totalPago)))}</span>` : '',
     dica:`Histórico das compras já pagas. Parcelamentos com a última parcela antes de ${mesLabel(mes)} vêm para cá automaticamente. Você também pode lançar compras antigas já quitadas: elas entram no histórico de dívida do Patrimônio. Para reativar um parcelamento, mude o término para ${mesCurto(mes)} ou depois.`,
     foot:`<button class="btn ghost" data-act="addquit">${ico('plus')} Parcelamento quitado</button>`, cls:'mb'});

  return pageHead('Dívida e cartões', `${brl(totMont)} ${modo === 'mes' ? 'em parcelas no mês' : 'de saldo devedor'}`,
      seg('dmodo', modo, [['saldo', 'Saldo devedor'], ['mes', 'Parcelas do mês']]))
    + `<datalist id="tiposList">${S.tipos.map(t => `<option value="${esc(t)}">`).join('')}</datalist>
    <div class="grid g-2-1">
      ${card('Dívida por tipo', `<div class="pie-wrap">${donutSVG(itTipo, {size:240, esp:34, titulo:tituloModo})}${legenda(itTipo)}</div>`,
        {dica: modo === 'mes' ? 'Soma das parcelas ativas neste mês, agrupadas pelo tipo.' : 'Saldo devedor = valor da parcela × meses restantes. Parcelas recorrentes (sem data de fim) entram com 1 mês.'})}
      ${card('Por cartão', `<div style="display:grid;justify-items:center;gap:14px">${donutSVG(itCartao, {size:180, esp:26, titulo:tituloModo})}${legenda(itCartao)}</div>`)}
    </div>
    <div class="grid g-1-1">
      ${card('Teto de gastos', `
        <div class="kv">
          <span class="muted">Teto (% do salário líquido)</span><span>${inNum('root::tetoPct', S.tetoPct, {cls:'sm lock'})}</span>
          <span class="muted">Salário líquido</span><span class="v">${brl(c.liquido)}</span>
          <span class="muted">Teto em R$</span><span class="v">${brl(c.teto)}</span>
          <span class="muted">Comprometido em ${mesCurto(mes)}</span><span class="v">${brl(c.usado)}</span>
        </div>
        <div style="margin:16px 0 6px">${meter(c.teto ? c.usado / c.teto : (c.usado ? 2 : 0), true)}</div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="muted">${pct(c.teto ? c.usado / c.teto * 100 : 0)} do teto usado</span>
          <span class="${livre >= 0 ? 'pos' : 'neg'}" style="font-weight:700">${livre >= 0 ? `${brl(livre)} livres` : `${brl(-livre)} acima do teto`}</span></div>
        <div class="kv" style="margin-top:14px">${S.cartoes.map(k => { const t = totalDivida(mes, k.id); return `<span><span class="dotc" style="--c:${esc(k.cor)};margin-right:8px"></span>${esc(k.nome)}</span><span class="v">${brl(t)} <span class="muted" style="font-weight:500">· ${pct(c.teto ? t / c.teto * 100 : 0)}</span></span>`; }).join('')}</div>`,
        {dica:'Base: salário líquido (arrecadação − itens marcados como Imposto no Orçamento).'})}
      ${card('Calendário de quitação', `<div class="kv">${quit.length ? quit.map(k => `<span>${mesLabel(k)}</span><span class="v pos">− ${brl(libera[k])}/mês</span>`).join('') : '<span class="muted">Nenhuma parcela com data de fim.</span><span></span>'}</div>`,
        {dica:'Quanto cada mês libera do orçamento quando as parcelas terminam.'})}
    </div>
    <div class="phead" style="margin:28px 0 14px"><div><div class="eyebrow">Parcelas por cartão</div><p class="hint" style="margin:6px 0 0">Preencha 2 de 3: <b>início</b>, <b>nº de parcelas</b> ou <b>término</b>. O terceiro é calculado (em cinza). Os dois em destaque são os que você digitou.</p></div>
      <div class="acts"><button class="btn" data-act="add" data-col="cartoes">${ico('plus')} Cartão</button></div></div>
    ${S.cartoes.map(blocoCartao).join('')}
    ${orfas.length ? card('Sem cartão', `<div class="tw"><table class="parc">${cabParc}<tbody>${linhas(orfas)}</tbody></table></div>`, {cls:'mb'}) : ''}
    ${card('Tipos de gasto', `<div class="tw"><table style="max-width:560px"><tbody>
        ${S.tipos.map(t => `<tr><td style="width:30px;padding-left:10px"><input type="color" class="sw" data-tipocor="${esc(t)}" value="${esc(S.tiposCor[t] || '#7c85ad')}"></td>
          <td class="tit"><input class="f name" type="text" data-tipo="${esc(t)}" value="${esc(t)}"></td><td class="muted">${tipoCount(t)} parcela(s)</td>
          <td class="ctl">${tipoCount(t) ? '' : `<button class="ib del" data-act="deltipo" data-arg="${esc(t)}" title="Remover">✕</button>`}</td></tr>`).join('')}
      </tbody></table></div>`, {dica:'Digite um tipo novo direto na parcela e ele aparece aqui. Renomear aqui atualiza todas as parcelas.', foot:`<button class="btn ghost" data-act="addtipo">${ico('plus')} Tipo</button>`, cls:'mb'})}
    ${cardQuit}`;
}

/* ============================================================
   Aba: Reserva de Contingência
   ============================================================ */
function vReserva(){
  const tot = reservaTotal(), meta = Number(S.reserva.meta) || 0, falta = Math.max(meta - tot, 0), frac = meta ? tot / meta : 0;
  const c = calc(), fr = c.fundos.find(f => f.it.reserva);
  const itens = S.reserva.ativos.map(a => ({label:a.produto, valor:valorRes(a), cor:a.cor || PALETA[0]})).filter(i => i.valor > 0);
  const inv = sum(S.reserva.ativos.map(investidoRes)), rend = tot - inv;
  const comAportes = S.reserva.ativos.filter(a => serieRes(a));
  const b = M.bcb;
  const mediaCDI = (() => { const xs = S.reserva.ativos.filter(a => Number(a.pctCDI) > 0); const t = sum(xs.map(valorRes)); return t ? sum(xs.map(a => valorRes(a) * Number(a.pctCDI))) / t : null; })();
  const taxaRes = b && b.cdiAno && mediaCDI != null ? b.cdiAno.valor * mediaCDI / 100 : null;
  const statusJuros = juros.carregando ? '<span class="pill"><span class="dot load"></span>Atualizando juros…</span>'
    : juros.offline ? '<span class="pill"><span class="dot off"></span>Sem conexão com o Banco Central</span>' : '';
  const nAp = id => S.resAportes.filter(x => x.ativoId === id).length;

  const linhaAportes = a => {
    const aps = S.resAportes.filter(x => x.ativoId === a.id).sort((x, y) => (x.data > y.data) - (x.data < y.data));
    return `<tr class="apbox"><td colspan="10"><div class="inner">
      <table class="mini" style="max-width:560px"><thead><tr><th>Data</th><th>Tipo</th><th class="r">Valor</th><th></th></tr></thead>
      <tbody>${aps.map(ap => `<tr>
          <td style="width:170px"><input class="f" type="date" data-set="resap:${ap.id}:data" value="${esc(ap.data || '')}" max="${hojeISO()}"></td>
          <td style="width:130px"><select class="f" data-set="resap:${ap.id}:tipo"><option value="aporte"${ap.tipo !== 'resgate' ? ' selected' : ''}>Aporte</option><option value="resgate"${ap.tipo === 'resgate' ? ' selected' : ''}>Resgate</option></select></td>
          <td class="r">${inNum(`resap:${ap.id}:valor`, ap.valor, {cls:'lock'})}</td>
          ${acts('resap', ap.id, {ord:false})}</tr>`).join('') || '<tr><td colspan="4" class="muted" style="padding:10px 8px">Nenhum aporte ainda.</td></tr>'}</tbody></table>
      <div class="cf" style="align-items:center"><button class="btn ghost" data-act="add" data-col="resap" data-arg="${a.id}">${ico('plus')} Aporte</button>
        <span class="hint" style="margin:0">Com o primeiro aporte, o valor atual passa a ser calculado: aportes − resgates, rendendo ${a.pctCDI ? `${String(a.pctCDI).replace('.', ',')}% do CDI` : 'o % do CDI informado'} dia a dia. Lance todos os aportes desde o início para o saldo bater com o banco.</span></div>
    </div></td></tr>`;
  };
  const linhaAtivo = a => {
    const s = serieRes(a), v = valorRes(a), aberto = !!S.ui.abertos[a.id], n = nAp(a.id);
    const r = s ? s.atual - s.investido : null, rp = r != null && s.investido ? r / s.investido * 100 : null;
    return `<tr>
      <td style="width:30px;padding-left:10px"><input type="color" class="sw" data-set="ativos:${a.id}:cor" value="${esc(a.cor || PALETA[0])}" title="Cor no gráfico"></td>
      <td class="tit">${inTxt(`ativos:${a.id}:produto`, a.produto, 'Produto financeiro')}</td>
      <td class="r" style="width:96px">${inNum(`ativos:${a.id}:pctCDI`, a.pctCDI, {cls:'sm lock'})}</td>
      <td class="r v">${brl(investidoRes(a))}</td>
      <td class="r">${s ? `<span class="v" style="font-weight:700">${brl(v)}</span>` : inNum(`ativos:${a.id}:valor`, a.valor, {cls:'lock'})}</td>
      <td class="r v ${r == null ? '' : r < 0 ? 'neg' : 'pos'}">${r == null ? '<span class="muted" data-tip="' + esc(tipHTML('Sem aportes', [['Lance os aportes para', 'calcular o rendimento']])) + '">—</span>'
        : `${brlS(r)}<div style="font-size:11.5px;opacity:.85">${s.semCdi ? 'aguardando CDI' : pctS(rp)}</div>`}</td>
      <td class="r v">${pct(tot ? v / tot * 100 : 0)}</td>
      <td style="width:110px">${inTxt(`ativos:${a.id}:liquidez`, a.liquidez, 'ex.: D+0', '')}</td>
      <td class="ctl"><button class="btn apb${aberto ? ' on' : ''}" data-act="abrir" data-id="${a.id}">Aportes · ${n} ${aberto ? '▴' : '▾'}</button></td>
      ${acts('ativos', a.id)}
    </tr>${aberto ? linhaAportes(a) : ''}`;
  };
  const tile = (rot, val, sub) => `<div><div class="eyebrow" style="font-size:10.5px">${rot}</div><div style="font-size:24px;font-weight:800;margin:6px 0 2px">${val}</div><div class="hint" style="margin:0">${sub}</div></div>`;
  const pctA = v => v == null ? '—' : v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
  const jurosCard = card('Juros no Brasil', b ? `<div class="jgrid">
      ${tile('Selic meta', pctA(b.selic && b.selic.valor), 'ao ano · Copom')}
      ${tile('CDI', pctA(b.cdiAno && b.cdiAno.valor), `ao ano${b.cdiAno ? ' · ' + dataBR(b.cdiAno.data) : ''}`)}
      ${tile('IPCA 12 meses', pctA(b.ipca && b.ipca.valor), `inflação${b.ipca ? ' · ' + mesLabel(b.ipca.data.slice(0, 7)) : ''}`)}
      ${tile('Sua reserva rende', taxaRes == null ? '—' : '≈ ' + pctA(taxaRes), mediaCDI == null ? 'informe o % do CDI' : `${mediaCDI.toLocaleString('pt-BR', {maximumFractionDigits:1})}% do CDI em média${b.ipca && taxaRes != null ? ` · ${pctA(taxaRes - b.ipca.valor)} acima da inflação` : ''}`)}
    </div>` : `<p class="muted" style="margin:0">${juros.carregando ? 'Buscando as taxas no Banco Central…' : 'Taxas indisponíveis agora. Verifique a internet e clique em Atualizar juros.'}</p>`,
    {right:`<button class="btn" data-act="juros">${ico('spark')} Atualizar juros</button>`, cls:'mb', dica:'Dados públicos do Banco Central (séries SGS). Valores brutos, antes do imposto de renda.'});

  // evolução: com aportes, saldo calculado pelo CDI mês a mês (com o rendimento do mês);
  // sem aportes, valores do calendário Real + total atual
  const hist = serieReservaMensal(), cm = corteMes('res');
  let evo;
  if (hist) {
    const h = hist.filter(x => x.k >= cm), hs = h.length ? h : hist.slice(-1);
    evo = (w, hh) => lineSVG(w, hh, {
      labels: hs.map(x => mesCurto(x.k)),
      series: [{label:'Reserva', cor:'#9085e9', valores: hs.map(x => x.saldo)}],
      ref: meta ? {valor: meta, label: 'Meta ' + kfmt(meta)} : null,
      tip: i => { const x = hs[i]; return tipHTML(mesLabel(x.k) + (x.k === hojeYM() ? ' (até hoje)' : ''), [['Saldo', brl(x.saldo)],
        ['Rendimento no mês', `${brlS(x.ganho)} (${pctS(x.r)})`], ['Aportes no mês', x.aportes ? brlS(x.aportes) : '—'], ...(meta ? [['Da meta', pct(x.saldo / meta * 100)]] : [])]); },
    });
  } else {
    const pts = {};
    Object.entries(S.anual.real).forEach(([k, v]) => { if (v.reserva != null) pts[k] = v.reserva; });
    if (pts[c.mes] == null) pts[c.mes] = tot;
    let ks = Object.keys(pts).sort().filter(k => k >= cm); if (!ks.length) ks = [c.mes];
    evo = (w, hh) => lineSVG(w, hh, {
      labels: ks.map(mesCurto),
      series: [{label:'Reserva', cor:'#9085e9', valores: ks.map(k => pts[k])}],
      ref: meta ? {valor: meta, label: 'Meta ' + kfmt(meta)} : null,
      tip: i => tipHTML(mesLabel(ks[i]), [['Reserva', brl(pts[ks[i]])], ...(meta ? [['Da meta', pct(pts[ks[i]] / meta * 100)]] : [])]),
    });
  }

  return pageHead('Reserva de contingência', brl(tot), `${statusJuros}${fr ? `<span class="pill"><span class="dot"></span>Aporte de ${MESES_L[+c.mes.slice(5) - 1].toLowerCase()}: ${brl(fr.v)}</span>` : ''}`)
    + `<div class="kpis">
        <div class="card kpi hero"><div class="lbl"><span class="badge">${ico('reserva')}</span>Meta da reserva</div><div class="val">${inNum('res::meta', meta, {cls:'lock'})}</div><div class="sub">clique para editar</div></div>
        ${kpi('Total atual', brl(tot), `${brl(inv)} investidos em ${S.reserva.ativos.length} ${S.reserva.ativos.length === 1 ? 'aplicação' : 'aplicações'}`, 'wallet', {cls:'pos'})}
        ${kpi('Rendimento', comAportes.length ? brlS(rend) : '—', comAportes.length ? `${pctS(inv ? rend / inv * 100 : 0)} sobre o investido` : 'lance os aportes para calcular', 'spark', {cls: rend > 0 && comAportes.length ? 'pos' : rend < 0 ? 'neg' : ''})}
        <div class="card kpi"><div class="lbl"><span class="badge">${ico('check')}</span>Meta atingida</div><div class="val">${pct(frac * 100)}</div>${meter(frac, true)}
          <div class="sub" style="margin-top:8px">${falta ? `faltam ${brl(falta)}${fr && fr.v > 0 ? ` · ~${Math.ceil(falta / fr.v)} meses` : ''}` : 'meta atingida'}</div></div>
      </div>
      <div class="grid g-1-2">
        ${card('Composição atual', `<div style="display:grid;justify-items:center;gap:14px">${donutSVG(itens, {size:200, esp:28})}${legenda(itens)}</div>`)}
        ${card('Evolução mês a mês', chartSlot(evo, 300) + `<div class="legend-line"><span><span class="dotc" style="--c:#9085e9;margin-right:6px"></span>Reserva</span>${meta ? '<span><span class="ls d"></span> Meta</span>' : ''}
            ${hist ? (() => { const h = hist.filter(x => x.k >= cm); const g = sum(h.map(x => x.ganho)); return `<span class="muted" style="margin-left:auto">Rendimento no período: <b class="${g < 0 ? 'neg' : 'pos'}">${brlS(g)}</b></span>`; })() : ''}</div>`,
          {right: segPer('res'), dica: hist
            ? 'Saldo no fim de cada mês calculado pelos aportes e resgates, rendendo o CDI diário × o % do CDI de cada aplicação. Aplicações sem aportes entram com o valor digitado. Passe o mouse para ver o rendimento do mês.'
            : 'Sem aportes lançados: usa o valor da reserva do calendário Real (Orçamento anual) e o total atual. Lance os aportes nas aplicações para o histórico incluir o rendimento.'})}
      </div>
      ${jurosCard}
      ${card('Onde está a reserva', `<div class="tw"><table>
          <thead><tr><th></th><th>Produto financeiro</th><th class="r">% do CDI</th><th class="r">Investido</th><th class="r">Valor atual</th><th class="r">Rendimento</th><th class="r">% da reserva</th><th>Liquidez</th><th></th><th></th></tr></thead>
          <tbody>${S.reserva.ativos.map(linhaAtivo).join('') || '<tr><td colspan="10" class="muted" style="padding:12px 8px">Nenhuma aplicação cadastrada.</td></tr>'}
            <tr class="tot"><td></td><td class="tit">Total</td><td></td><td class="r v">${brl(inv)}</td><td class="r v">${brl(tot)}</td><td class="r v ${rend < 0 ? 'neg' : rend > 0 ? 'pos' : ''}">${comAportes.length ? brlS(rend) : ''}</td><td class="r v">100%</td><td colspan="3"></td></tr></tbody>
        </table></div>`, {foot:`<button class="btn ghost" data-act="add" data-col="ativos">${ico('plus')} Aplicação</button>`,
          dica:'Aplicações sem aportes usam o valor que você digita. Ao lançar aportes, o valor atual é calculado pelo CDI diário do Banco Central × o % do CDI de cada aplicação (valor bruto, antes do IR).'})}`;
}

/* ============================================================
   Aba: Orçamento anual
   ============================================================ */
function vAnual(){
  const ano = S.ui.ano, atual = S.config.mesAtual, modo = S.ui.anualModo, cores = S.ui.cores;
  const ks = MESES.map((_, i) => ym(ano, i + 1));
  const val = (kind, k, f) => {
    if (f === 'primario') { const g = S.anual[kind][k]?.ganhos, x = S.anual[kind][k]?.fixos; return (g == null && x == null) ? null : (g || 0) - (x || 0); }
    return S.anual[kind][k]?.[f] ?? null;
  };

  const series = [];
  SERIES.forEach(se => {
    if (modo !== 'proj') series.push({label:se.label, curto:se.curto, cor:cores[se.k], valores:ks.map(k => val('real', k, se.k))});
    if (modo !== 'real') series.push({label:se.label + ' (projeção)', curto:se.curto, cor:cores[se.k], tracejada: modo === 'ambos', valores:ks.map(k => val('proj', k, se.k))});
  });
  const grafico = (w, h) => lineSVG(w, h, {
    labels: MESES, series, rotuloFim: true,
    tip: i => {
      const k = ks[i], linhas = [];
      SERIES.forEach(se => {
        const r = val('real', k, se.k), p = val('proj', k, se.k);
        const txt = modo === 'real' ? (r == null ? '—' : brl0(r)) : modo === 'proj' ? (p == null ? '—' : brl0(p))
                  : `${r == null ? '—' : brl0(r)} / ${p == null ? '—' : brl0(p)}`;
        linhas.push([se.label.replace(' de contingência', ''), txt]);
      });
      return tipHTML(mesLabel(k) + (modo === 'ambos' ? ' · real / proj.' : ''), linhas);
    },
  });

  const cols = `<colgroup><col style="width:150px">${ks.map(() => '<col>').join('')}<col style="width:96px"></colgroup>`;
  const head = `<thead><tr><th></th>${ks.map((k, i) => `<th class="r${k === atual ? ' cur' : ''}">${MESES[i]}${S.historico[k] ? ' ✓' : ''}</th>`).join('')}<th class="r">Ano</th></tr></thead>`;
  const cc = k => k === atual ? ' cur' : '';
  const tabela = kind => {
    const linha = f => {
      const se = SERIES.find(s => s.k === f), vals = ks.map(k => val(kind, k, f));
      const tot = f === 'reserva' ? [...vals].reverse().find(v => v != null) : (vals.some(v => v != null) ? sum(vals) : null);
      const celulas = f === 'primario'
        ? ks.map((k, i) => `<td class="v${cc(k)} ${vals[i] != null && vals[i] < 0 ? 'neg' : ''}">${vals[i] == null ? '' : fmtIn(vals[i])}</td>`).join('')
        : ks.map(k => `<td class="${cc(k).trim()}">${inNum(`${kind}:${k}:${f}`, val(kind, k, f), {cls:'lock'})}</td>`).join('');
      return `<tr class="${f === 'primario' ? 'calc' : ''}"><td><span class="dotc" style="--c:${esc(cores[f])};margin-right:7px"></span>${se.label.replace(' de contingência', '')}</td>${celulas}<td class="yt">${tot == null ? '' : brl0(tot)}</td></tr>`;
    };
    return `<div class="tw"><table class="cal">${cols}${head}<tbody>${SERIES.map(s => linha(s.k)).join('')}</tbody></table></div>`;
  };
  const desvio = `<div class="tw"><table class="cal">${cols}${head}<tbody>${SERIES.map(se => `<tr><td><span class="dotc" style="--c:${esc(cores[se.k])};margin-right:7px"></span>${se.label.replace(' de contingência', '')}</td>${ks.map(k => {
      const r = val('real', k, se.k), p = val('proj', k, se.k);
      if (r == null || p == null) return `<td class="v${cc(k)}"></td>`;
      const d = r - p, bom = se.k === 'fixos' ? d <= 0 : d >= 0;
      return `<td class="v${cc(k)} ${Math.abs(d) < .005 ? 'muted' : bom ? 'pos' : 'neg'}">${d > 0 ? '+' : ''}${fmtIn(d)}</td>`;
    }).join('')}<td></td></tr>`).join('')}</tbody></table></div>`;

  const hist = ks.filter(k => S.historico[k]).map(k => {
    const h = S.historico[k], r = h.resumo;
    const lista = arr => arr.length ? arr.map(x => `<span class="muted">${esc(x.nome)}</span><span class="v">${brl(x.v)}</span>`).join('') : '<span class="muted">—</span><span></span>';
    return `<details><summary>${mesLabel(k)} <span class="muted" style="font-weight:500">· fechado em ${new Date(h.fechadoEm).toLocaleDateString('pt-BR')}</span></summary>
      <div class="grid g-1-1" style="margin:12px 0 0">
        <div class="kv">
          <span class="muted">Arrecadação</span><span class="v">${brl(r.arrec)}</span>
          <span class="muted">Impostos e despesas fixas</span><span class="v">${brl(r.totalFixos)}</span>
          <span class="muted">Resultado primário</span><span class="v">${brl(r.primario)}</span>
          <span class="muted">Separado em fundos</span><span class="v">${brl(r.totalFundos)}</span>
          <span class="muted">Superávit nominal</span><span class="v">${brl(r.superavit)}</span>
          <span class="muted">Rendas extras</span><span class="v">${brl(r.rendas)}</span>
          <span class="muted">Gastos não fixos</span><span class="v">${brl(r.gastos)}</span>
          <span class="muted">Aportes do caixa</span><span class="v">${brl(r.aportes)}</span>
          <span class="muted">Total em caixa</span><span class="v">${brl(r.totalCaixa)}</span>
          <span class="muted">Reserva</span><span class="v">${brl(r.reserva)}</span></div>
        <div class="kv">${lista(h.fixos)}<span class="sep"></span>${lista(h.fundos)}<span class="sep"></span>${lista(h.caixa)}</div>
      </div></details>`;
  }).join('');

  return pageHead('Orçamento anual', `Projeção e real · ${ano}`,
      `<button class="navbtn" data-act="ano" data-arg="-1" title="Ano anterior">${ico('left').replace('<svg', '<svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2"')}</button>
       <span class="pill">${ico('anual').replace('<svg', '<svg style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8"')} ${ano}</span>
       <button class="navbtn" data-act="ano" data-arg="1" title="Próximo ano">${ico('right').replace('<svg', '<svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2"')}</button>`)
    + card(`Evolução · ${ano}`, chartSlot(grafico, 320) + `
        <div class="legend-line">
          ${SERIES.map(se => `<label title="Clique para mudar a cor"><input type="color" class="sw" data-cor="${se.k}" value="${esc(cores[se.k])}">${se.label}</label>`).join('')}
          ${modo === 'ambos' ? '<span style="margin-left:auto"><span class="ls"></span> Real &nbsp; <span class="ls d"></span> Projeção</span>' : ''}
        </div>`, {right: seg('amodo', modo, [['ambos', 'Ambos'], ['real', 'Real'], ['proj', 'Projeção']]), cls:'mb'})
    + card(`Projeção · ${ano}`, tabela('proj'), {cls:'mb',
        dica:`Digite livremente ou use o botão: ganhos de hoje, gastos caindo conforme as parcelas terminam e a reserva crescendo com o aporte do fundo Reserva. Só preenche a partir de ${mesLabel(atual)}.`,
        foot:`<button class="btn" data-act="preencher">${ico('spark')} Preencher a partir do orçamento</button>`})
    + card(`Real · ${ano}`, tabela('real'), {cls:'mb', dica:'Preenchido ao fechar cada mês (✓). Você pode corrigir qualquer valor.'})
    + card('Real − Projeção', desvio, {cls:'mb'})
    + (hist ? card(`Meses fechados · ${ano}`, hist) : '');
}

const brlS = v => (v > 0 ? '+ ' : v < 0 ? '− ' : '') + brl(Math.abs(v));
const pctS = v => (v > 0 ? '+' : '') + pct(v);

function statusCotacoes(){
  if (!S.invAtivos.some(a => !ehManual(a))) return '';
  const hora = M.ultima ? new Date(M.ultima).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : null;
  if (mkt.carregando) return '<span class="pill"><span class="dot load"></span>Atualizando cotações…</span>';
  if (mkt.offline) return `<span class="pill" data-tip="${esc(tipHTML('Cotações indisponíveis', [['Abra o planner pelo atalho', '“Abrir Planner”'], ['Usando', hora ? 'as de ' + hora : 'valores salvos']]))}"><span class="dot off"></span>Sem conexão com as cotações</span>`;
  return hora ? `<span class="pill"><span class="dot"></span>Cotações das ${hora}</span>` : '';
}

function vPatrimonio(){
  const ks = mesesPatrimonio(), serie = ks.map(patrimonioEm), agora = serie[serie.length - 1], ant = serie[serie.length - 2];
  const varMes = ant ? agora.pl - ant.pl : null;
  const modo = S.ui.patModo === 'valores' ? 'valores' : 'rent';
  const rent = rentabilidadeMensal(), rUlt = rent[rent.length - 1];
  const yfmt = v => (v > 0 ? '+' : '') + v.toLocaleString('pt-BR', {maximumFractionDigits: Math.abs(v) < 10 ? 2 : 1}) + '%';
  // recorte do período escolhido (meses)
  const cm = corteMes('pat');
  const rentP = rent.filter(x => x.k >= cm);
  const acumP = rentP.length ? (rentP.reduce((f, x) => f * (1 + x.r / 100), 1) - 1) * 100 : null;
  const iP = ks.findIndex(k => k >= cm), ksP = iP < 0 ? ks.slice(-1) : ks.slice(iP), serieP = serie.slice(serie.length - ksP.length);
  const rentChart = (w, h) => rentP.length ? lineSVG(w, h, {
    labels: rentP.map(x => mesCurto(x.k)), yfmt, rotuloFim: false,
    series: [{label:'Rentabilidade no mês', cor:'#199e70', valores: rentP.map(x => x.r)}],
    tip: i => tipHTML(mesLabel(rentP[i].k) + (rentP[i].k === hojeYM() ? ' (até hoje)' : ''), [['No mês', yfmt(rentP[i].r)], ['Acumulada desde o início', yfmt(rentP[i].acum)], ['Rendimento', brlS(rentP[i].ganho)], ['Valor que rende', brl0(rentP[i].V)]]),
  }) : `<div class="empty">${rent.length ? 'Sem rentabilidade neste período.' : 'Lance aportes com data em Investimentos ou na Reserva para ver a rentabilidade.'}</div>`;

  const plChart = (w, h) => lineSVG(w, h, {
    labels: ksP.map(mesCurto), rotuloFim: true,
    series: [{label:'Patrimônio líquido', curto:'Líquido', cor:'#3987e5', valores: serieP.map(s => s.pl)},
             {label:'Ativos', curto:'Ativos', cor:'#199e70', valores: serieP.map(s => s.ativos)},
             {label:'Passivos', curto:'Passivos', cor:'#d95926', valores: serieP.map(s => s.divida)}],
    tip: i => tipHTML(mesLabel(ksP[i]), [['Patrimônio líquido', brl0(serieP[i].pl)], ['Reserva', brl0(serieP[i].reserva)],
               ['Investimentos', brl0(serieP[i].invest)], ['Bens', brl0(serieP[i].bens)], ['Dívidas', '− ' + brl0(serieP[i].divida)]]),
  });
  const comp = [{label:'Investimentos', valor:agora.invest, cor:'#3987e5'}, {label:'Reserva de contingência', valor:agora.reserva, cor:'#199e70'},
                {label:'Bens', valor:agora.bens, cor:'#c98500'}].filter(i => i.valor > 0);

  // projeção da dívida até a quitação
  const ini = S.config.mesAtual; let fim = ini;
  S.parcelas.forEach(p => { if (p.ultima && fimReal(p) > fim) fim = fimReal(p); });
  const kd = []; for (let k = ini; k <= addMonths(fim, 1); k = addMonths(k, 1)) kd.push(k);
  const recMes = sum(S.parcelas.filter(p => !p.ultima).map(p => p.valor));
  const cartoesCom = S.cartoes.filter(c => S.parcelas.some(p => p.cartaoId === c.id && p.ultima && fimReal(p) >= ini));
  const totProj = kd.map(k => saldoDevedorEm(k, {recorrentes:false}));
  const divChart = (w, h) => lineSVG(w, h, {
    labels: kd.map(mesCurto), rotuloFim: true,
    series: [{label:'Saldo devedor total', curto:'Total', cor:'#3987e5', valores: totProj},
             ...cartoesCom.map(c => ({label:c.nome, curto:c.nome, cor:c.cor, valores: kd.map(k => saldoDevedorEm(k, {cartaoId:c.id, recorrentes:false}))}))],
    tip: i => tipHTML(mesLabel(kd[i]), [['Saldo devedor', brl(totProj[i])],
              ...cartoesCom.map(c => [c.nome, brl(saldoDevedorEm(kd[i], {cartaoId:c.id, recorrentes:false}))]),
              ['Parcelas do mês', brl(sum(S.parcelas.filter(p => p.ultima).map(p => pagamentoEm(p, kd[i]))))]]),
  });

  const cats = [...new Set(['Imóvel', 'Veículo', 'Eletrônicos', 'Outros', ...S.bens.map(b => b.categoria).filter(Boolean)])];
  const bens = card('Bens', `<datalist id="catBens">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <div class="tw"><table>
      <thead><tr><th>Bem</th><th>Categoria</th><th class="r">Valor</th><th>Desde</th><th></th></tr></thead>
      <tbody>${S.bens.map(b => `<tr>
          <td class="tit">${inTxt(`bens:${b.id}:nome`, b.nome, 'Ex.: Carro')}</td>
          <td style="width:200px">${inTxt(`bens:${b.id}:categoria`, b.categoria, 'Categoria', '', 'list="catBens"')}</td>
          <td class="r">${inNum(`bens:${b.id}:valor`, b.valor, {cls:'lock'})}</td>
          <td style="width:110px">${inMes(`bens:${b.id}:mes`, b.mes, {opcional:true, cls: b.mes ? 'lock' : ''})}</td>
          ${acts('bens', b.id)}</tr>`).join('') || '<tr><td colspan="5" class="muted" style="padding:12px 8px">Nenhum bem cadastrado.</td></tr>'}
        <tr class="tot"><td class="tit" style="padding-left:12px">Total</td><td></td><td class="r" style="padding-right:12px">${brl(totalBens())}</td><td colspan="2"></td></tr></tbody>
    </table></div>`, {right:`<span class="tot">${brl(totalBens())}</span>`, dica:'Imóveis, veículos e outros bens com valor de mercado. Entram nos ativos do patrimônio a partir do mês informado (ou sempre, se vazio).',
      foot:`<button class="btn ghost" data-act="add" data-col="bens">${ico('plus')} Bem</button>`});

  return pageHead('Patrimônio', brl(agora.pl), `${statusCotacoes()}<span class="pill"><span class="dot"></span>${diasPagamento()}</span>`)
    + `<div class="kpis">
        ${kpi('Patrimônio líquido', brl(agora.pl), varMes == null ? 'ativos − passivos' : `${brlS(varMes)} no mês`, 'patrimonio', {hero:true, cls:sg(agora.pl)})}
        ${kpi('Rentabilidade', rUlt ? yfmt(rUlt.acum) : '—', rUlt ? `${yfmt(rUlt.r)} em ${MESES_L[+rUlt.k.slice(5) - 1].toLowerCase()} · desde ${mesCurto(rent[0].k)}` : 'lance aportes com data', 'spark', {cls: !rUlt ? '' : rUlt.acum < 0 ? 'neg' : 'pos'})}
        ${kpi('Ativos', brl(agora.ativos), 'reserva + investimentos + bens', 'up', {cls:'pos'})}
        ${kpi('Passivos', brl(agora.divida), 'saldo devedor das dívidas', 'down')}
      </div>
      <div class="grid g-2-1">
        ${card('Evolução do patrimônio', modo === 'rent'
            ? chartSlot(rentChart, 300) + `<div class="legend-line"><span><span class="dotc" style="--c:#199e70;margin-right:6px"></span>Rentabilidade no mês</span>${acumP != null ? `<span class="muted" style="margin-left:auto">Acumulada no período: <b style="color:var(--ink)">${yfmt(acumP)}</b></span>` : ''}</div>`
            : chartSlot(plChart, 300) + `<div class="legend-line"><span><span class="dotc" style="--c:#3987e5;margin-right:6px"></span>Patrimônio líquido</span><span><span class="dotc" style="--c:#199e70;margin-right:6px"></span>Ativos</span><span><span class="dotc" style="--c:#d95926;margin-right:6px"></span>Passivos</span></div>`,
          {right: `<div style="display:flex;gap:8px;flex-wrap:wrap">${seg('patModo', modo, [['rent', 'Rentabilidade'], ['valores', 'Valores']])}${segPer('pat')}</div>`,
           dica: modo === 'rent'
            ? 'Rentabilidade mensal de tudo o que rende somado: investimentos (pelas cotações) e aplicações da reserva com aportes (pelo CDI). Aportes e resgates não contam como ganho. Bens e dívidas não rendem e ficam de fora.'
            : 'Meses fechados usam o valor gravado no fechamento. Meses anteriores são estimados: reserva do calendário Real, investimentos pelas cotações da época, bens pela data de aquisição e dívida pelo saldo das parcelas.'})}
        ${card('Composição', `<div style="display:grid;justify-items:center;gap:14px">${donutSVG(comp, {size:200, esp:28, titulo:'ATIVOS'})}${legenda(comp)}</div>`)}
      </div>
      ${card('Projeção da dívida até a quitação', chartSlot(divChart, 280) + `<div class="legend-line"><span><span class="dotc" style="--c:#3987e5;margin-right:6px"></span>Total</span>${cartoesCom.map(c => `<span><span class="dotc" style="--c:${esc(c.cor)};margin-right:6px"></span>${esc(c.nome)}</span>`).join('')}
          ${recMes ? `<span class="muted" style="margin-left:auto">Recorrentes ficam de fora: ${brl(recMes)}/mês sem data de fim</span>` : ''}</div>`,
        {cls:'mb', right: fim > ini ? `<span class="muted" style="margin-right:10px">quitação em</span><span class="tot">${mesLabel(fim)}</span>` : '',
         dica:'Saldo devedor no início de cada mês (valor da parcela × parcelas restantes), por cartão, com base na aba Dívida.'})}
      ${bens}`;
}

   Aba: Investimentos
   ============================================================ */
function vInvestimentos(){
  const sel = S.carteiras.some(c => c.id === S.ui.invCarteira) ? S.ui.invCarteira : 'todas';
  const cartSel = S.carteiras.find(c => c.id === sel), ref = cartSel ? (cartSel.moeda || 'BRL') : 'BRL';
  const ativosSel = S.invAtivos.filter(a => sel === 'todas' || a.carteiraId === sel);
  const P = {}; S.invAtivos.forEach(a => { P[a.id] = posicao(a); });
  /* soma em R$ ou na moeda da carteira ("emRef") */
  const soma = (lista, emRef = false) => {
    let atual = 0, custo = 0, atualBRL = 0;
    lista.forEach(a => { const p = P[a.id];
      atualBRL += p.atual ?? p.custo;
      if (emRef) { atual += p.atualC ?? p.custoC ?? 0; custo += p.custoC ?? 0; } else { atual += p.atual ?? p.custo; custo += p.custo; } });
    return {atual, custo, atualBRL, rend: atual - custo, pct: custo ? (atual / custo - 1) * 100 : 0};
  };
  const rr = rendRef(ref), T = soma(ativosSel, rr !== 'BRL');
  const totBTC = ref === 'BTC' ? sum(ativosSel.map(a => P[a.id].atualC ?? 0)) : null;
  const cmp = S.ui.invCmp;
  const yfmt = v => (v > 0 ? '+' : '') + v.toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%';

  const grafico = (w, h) => {
    const s = serieRendimento(ativosSel, rr);
    if (!s || !s.length) return `<div class="empty">${S.invAtivos.length ? 'Lance aportes com data e deixe o servidor de cotações rodando para ver o rendimento.' : 'Cadastre um ativo e um aporte com data para ver o rendimento.'}</div>`;
    let pts = s.filter(p => p.d >= corteISO('inv')); if (!pts.length) pts = s.slice(-1);
    const passo = Math.ceil(pts.length / 240); pts = pts.filter((p, i) => i % passo === 0 || i === pts.length - 1);
    const base = pts[0], dias = (new Date(pts[pts.length - 1].d) - new Date(base.d)) / 864e5;
    const rot = d => dias > 370 ? mesCurto(d.slice(0, 7)) : d.slice(8) + '/' + d.slice(5, 7);
    const idxS = k => { const sym = IDX[k].sym, b = precoEm(sym, base.d); return b ? pts.map(p => { const v = precoEm(sym, p.d); return v == null ? null : (v / b - 1) * 100; }) : null; };
    const series = [{label:'Carteira', curto:'Carteira', cor:COR_CARTEIRA, valores: pts.map(p => (p.idx / base.idx - 1) * 100)}];
    const extra = {};
    ['sp', 'ibov'].forEach(k => { if (cmp[k] && M.q[IDX[k].sym]) { extra[k] = idxS(k); if (extra[k]) series.push({label:IDX[k].label, curto:IDX[k].label, cor:IDX[k].cor, valores:extra[k]}); } });
    return lineSVG(w, h, {labels: pts.map(p => rot(p.d)), series, rotuloFim: true, yfmt, pontos: pts.length <= 40,
      tip: i => tipHTML(dataBR(pts[i].d), [['Carteira', yfmt(series[0].valores[i])],
        ...Object.keys(extra).filter(k => extra[k]).map(k => [IDX[k].label, extra[k][i] == null ? '—' : yfmt(extra[k][i])]),
        ['Valor', fmtM(pts[i].V, rr)]])});
  };

  const porClasse = {};
  ativosSel.forEach(a => { const c = classeDe(a) || {nome:'Sem classe', cor:'#5d6584'}; const p = P[a.id]; porClasse[c.nome] = porClasse[c.nome] || {label:c.nome, cor:c.cor, valor:0}; porClasse[c.nome].valor += p.atual ?? p.custo; });
  const itClasse = Object.values(porClasse).filter(i => i.valor > 0).sort((a, b) => b.valor - a.valor);

  // câmbio acompanhado
  const variacao = sym => { const q = M.q[sym]; if (!q || !q.c || !q.c.length) return null; const prev = q.d[q.d.length - 1] >= hojeISO() ? q.c[q.c.length - 2] : q.c[q.c.length - 1]; return prev ? (q.preco / prev - 1) * 100 : null; };
  const usd = fxEm('USD', hojeISO()), btc = fxEm('BTC', hojeISO());
  const vBtc = (() => { const a = variacao('BTC-USD'), b = variacao('USDBRL=X'); return a == null || b == null ? null : ((1 + a / 100) * (1 + b / 100) - 1) * 100; })();
  const pillFx = (rot, val, v) => val == null ? '' : `<span class="pill" data-tip="${esc(tipHTML(rot, [['Cotação', brl(val)], ['Variação no dia', v == null ? '—' : pctS(v)]]))}">${rot} <b style="color:var(--ink)">${val >= 1e4 ? brl0(val) : brl(val)}</b>${v == null ? '' : `<span class="${v < 0 ? 'neg' : 'pos'}" style="font-size:12px">${pctS(v)}</span>`}</span>`;
  const cambio = pillFx('Dólar', usd, variacao('USDBRL=X')) + pillFx('Bitcoin', btc, vBtc);
  const aviso = !mkt.offline ? '' : mkt.semServico
    ? `<div class="warn" style="margin:0 0 16px">Nenhum serviço de cotações configurado neste aparelho. Configure em <button class="lnk" data-act="tab" data-arg="config">Ajustes → Serviço de cotações</button>. Enquanto isso, aparecem os últimos valores salvos.</div>`
    : `<div class="warn" style="margin:0 0 16px">Sem conexão com o serviço de cotações. Verifique a internet${API_LOCAL != null && !S.config.cotacoesUrl ? ' e se o servidor do PC está ligado (<b>Abrir Planner.bat</b>)' : ''}. Enquanto isso, aparecem os últimos valores salvos.</div>`;

  const fmMoeda = (v, moeda) => v == null ? '—' : moeda === 'BRL' ? brl(v) : v.toLocaleString('pt-BR', {style:'currency', currency:moeda, maximumFractionDigits: v < 1 ? 6 : 2});
  const linhaAportes = (a, p) => {
    const aps = S.aportes.filter(x => x.ativoId === a.id).sort((x, y) => (x.data > y.data) - (x.data < y.data));
    if (pagaEmFiat(a)) {   // carteira em bitcoin: data + quantos BTC OU quanto pagou em R$/US$
      const rowsB = aps.map(ap => { const c = apCalc(ap, a), mp = ap.moedaPg || 'BRL'; return `<tr>
          <td style="width:170px"><input class="f" type="date" data-set="aportes:${ap.id}:data" value="${esc(ap.data || '')}" max="${hojeISO()}"></td>
          <td style="width:120px"><select class="f" data-set="aportes:${ap.id}:tipo"><option value="compra"${ap.tipo !== 'venda' ? ' selected' : ''}>Compra</option><option value="venda"${ap.tipo === 'venda' ? ' selected' : ''}>Venda</option></select></td>
          <td class="r">${inNum(`aportes:${ap.id}:qtd`, c.qtd, {cls: ap.fixo === 'qtd' ? 'lock' : 'calc', fmt: fmtQ})}</td>
          <td style="width:110px"><select class="f" data-set="aportes:${ap.id}:moedaPg"><option value="BRL"${mp === 'BRL' ? ' selected' : ''}>R$</option><option value="USD"${mp === 'USD' ? ' selected' : ''}>US$</option></select></td>
          <td class="r">${inNum(`aportes:${ap.id}:valor`, c.valor, {cls: ap.fixo !== 'qtd' ? 'lock' : 'calc'})}</td>
          <td class="r">${inNum(`aportes:${ap.id}:preco`, c.preco, {cls: ap.precoAuto === false ? 'lock' : 'calc'})}</td>
          ${acts('aportes', ap.id, {ord:false})}</tr>`; }).join('');
      return `<tr class="apbox"><td colspan="11"><div class="inner">
        <table class="mini"><thead><tr><th>Data</th><th>Tipo</th><th class="r">Quantidade (₿)</th><th>Pago em</th><th class="r">Valor pago</th><th class="r">Preço do BTC</th><th></th></tr></thead>
        <tbody>${rowsB || '<tr><td colspan="7" class="muted" style="padding:10px 8px">Nenhum aporte ainda.</td></tr>'}</tbody></table>
        <div class="cf" style="align-items:center"><button class="btn ghost" data-act="add" data-col="aportes" data-arg="${a.id}">${ico('plus')} Aporte</button>
          <span class="hint" style="margin:0">Informe quantos BTC comprou OU quanto pagou (em R$ ou US$): o outro sai da cotação do bitcoin no dia. Se souber o preço exato pago por 1 BTC, digite em “Preço do BTC”.</span></div>
      </div></td></tr>`;
    }
    const rows = aps.map(ap => { const c = apCalc(ap, a); return `<tr>
        <td style="width:170px"><input class="f" type="date" data-set="aportes:${ap.id}:data" value="${esc(ap.data || '')}" max="${hojeISO()}"></td>
        <td style="width:120px"><select class="f" data-set="aportes:${ap.id}:tipo"><option value="compra"${ap.tipo !== 'venda' ? ' selected' : ''}>Compra</option><option value="venda"${ap.tipo === 'venda' ? ' selected' : ''}>Venda</option></select></td>
        ${p.manual ? '<td class="r muted v">—</td><td class="r muted v">—</td>' : `
        <td class="r">${inNum(`aportes:${ap.id}:qtd`, c.qtd, {cls: ap.fixo === 'qtd' ? 'lock' : 'calc', fmt: fmtQ})}</td>
        <td class="r">${inNum(`aportes:${ap.id}:preco`, c.preco, {cls: ap.precoAuto === false ? 'lock' : 'calc', fmt: fmtP})}</td>`}
        <td class="r">${inNum(`aportes:${ap.id}:valor`, c.valor, {cls: p.manual || ap.fixo !== 'qtd' ? 'lock' : 'calc'})}</td>

const app = document.getElementById('app');
const TABS = [['patrimonio', 'Patrimônio', vPatrimonio], ['orcamento', 'Orçamento', vOrcamento], ['contas', 'Contas', vContas], ['divida', 'Dívida', vDivida], ['reserva', 'Reserva', vReserva],

function diasPagamento(){
  const d = Math.max(1, Math.min(31, Math.round(Number(S.config.diaPagamento) || 10)));
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const alvo = (y, m) => new Date(y, m, Math.min(d, new Date(y, m + 1, 0).getDate()));
  let t = alvo(hoje.getFullYear(), hoje.getMonth());
  if (t < hoje) t = alvo(hoje.getFullYear(), hoje.getMonth() + 1);
  const n = Math.round((t - hoje) / 86400000);
  return n === 0 ? 'Pagamento hoje' : `Pagamento em ${n} ${n === 1 ? 'dia' : 'dias'}`;
}

let focoPendente = null;
/* animação de entrada: só quando uma aba é aberta (e no primeiro carregamento), não a cada edição */
let animarAba = true, animTimer = null, animandoAte = 0, fundoTimer = null;
/* redesenho pedido por atualização em segundo plano (cotações, juros): espera a animação de entrada terminar */
function agendarFundo(){
  const resta = animandoAte - performance.now();
  if (resta > 0) { clearTimeout(fundoTimer); fundoTimer = setTimeout(agendar, resta + 40); }
  else agendar();
}
const EASE = 'cubic-bezier(.2,.75,.2,1)';
function animarEntrada(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !app.animate) return;
  // cada abertura de aba cuida só das próprias animações
  clearTimeout(animTimer);
  const criadas = [];
  const anima = (el, kf, op) => { const a = el.animate(kf, op); criadas.push(a); return a; };
  // blocos da página em sequência: cabeçalho, indicadores, cards (os de uma grade entram um a um)
  const alvos = [];
  [...app.children].forEach(el => { if (el.matches('.kpis, .grid')) alvos.push(...el.children); else alvos.push(el); });
  alvos.forEach((el, i) => anima(el, 
    [{opacity:0, transform:'translateY(14px)'}, {opacity:1, transform:'none'}],
    {duration:460, delay:Math.min(i, 10) * 55, easing:EASE, fill:'backwards'}));
  // gráficos de linha: a linha se desenha; tracejadas, rótulos e pontos aparecem em seguida
  app.querySelectorAll('svg.lc').forEach(svg => {
    svg.querySelectorAll('path').forEach((pth, j) => {
      if (pth.getAttribute('stroke-dasharray')) {
        anima(pth, [{opacity:0}, {opacity:+(pth.getAttribute('opacity') || 1)}], {duration:600, delay:500 + j * 60, fill:'backwards'});
        return;
      }
      const L = pth.getTotalLength ? pth.getTotalLength() : 0; if (!L) return;
      pth.style.strokeDasharray = L;
      const a = anima(pth, [{strokeDashoffset:L}, {strokeDashoffset:0}], {duration:1000, delay:280 + j * 90, easing:'cubic-bezier(.35,.6,.2,1)', fill:'backwards'});
      a.onfinish = a.oncancel = () => { pth.style.strokeDasharray = ''; };
    });
    svg.querySelectorAll(':scope > circle, .elbl, .reflbl, .ref').forEach(el =>
      anima(el, [{opacity:0}, {opacity:1}], {duration:400, delay:1050, fill:'backwards'}));
  });
  // roscas: as fatias giram até a posição; o total no meio aparece por último
  app.querySelectorAll('svg.donut').forEach(svg => {
    svg.querySelectorAll('.slice').forEach((sl, j) => anima(sl, 
      [{opacity:0, transform:'rotate(-35deg) scale(.82)'}, {opacity:1, transform:'none'}],
      {duration:650, delay:260 + j * 80, easing:EASE, fill:'backwards'}));
    svg.querySelectorAll('text').forEach(t => anima(t, [{opacity:0}, {opacity:1}], {duration:400, delay:650, fill:'backwards'}));
  });
  // barras de progresso crescem do zero
  app.querySelectorAll('.meter i').forEach(i => {
    const w = i.style.width; if (!w || w === '0%') return;
    anima(i, [{width:'0%'}, {width:w}], {duration:900, delay:350, easing:EASE, fill:'backwards'});
  });
  animandoAte = performance.now() + 2100;
  // proteção: se o navegador não desenhar quadros (janela em segundo plano), termina estas animações para nada ficar escondido
  animTimer = setTimeout(() => {
    criadas.forEach(an => { if (an.playState !== 'finished') { try { an.finish(); } catch (e) {} } });
    app.querySelectorAll('svg.lc path').forEach(pth => { if (!pth.getAttribute('stroke-dasharray')) pth.style.strokeDasharray = ''; });
  }, 3200);
}

  const a = document.activeElement;

  const selecionar = !!focoPendente;

  CH = {}; chN = 0; memoRes = {}; memoCron = {};
  if (mpAlvo) fecharSeletorMes();   // o campo vai ser recriado; se o foco voltar a ele, o seletor reabre
  document.getElementById('rail').innerHTML = perfilHTML() + TABS.map(([k, l]) =>

  const view = (TABS.find(t => t[0] === S.ui.tab) || TABS[0])[2];
  app.innerHTML = view() + (semStorage ? '<div class="warn">Não foi possível salvar neste navegador (armazenamento bloqueado). Use “Exportar backup” para não perder os dados.</div>' : '');

/* seletor de mês (substitui o campo de mês do navegador, que mostra "novembro de 2026" e corta) */
const mp = document.getElementById('mespick');
let mpAlvo = null, mpAno = null;
function abrirSeletorMes(el){
  mpAlvo = el; mp.innerHTML = '';
  const k = (el.dataset.compra || '').slice(0, 7) || parseMes(el.value) || el.dataset.mes || hojeYM();
  mpAno = +k.slice(0, 4);
  desenharSeletorMes(); mp.hidden = false; posicionarSeletorMes();
}
function desenharSeletorMes(){
  if (!mpAlvo) return;
  const ds = mpAlvo.dataset, compra = ds.compra || '';
  const sel = compra ? compra.slice(0, 7) : (parseMes(mpAlvo.value) || ''), hoje = hojeYM();
  const diaAtual = (document.getElementById('mpDia') || {}).value ?? (compra ? String(+compra.slice(8)) : '');
  mp.innerHTML = `<div class="mp-h"><button type="button" class="mp-nav" data-mp="-1" title="Ano anterior">‹</button><b>${mpAno}</b><button type="button" class="mp-nav" data-mp="1" title="Próximo ano">›</button></div>
    <div class="mp-g">${MESES.map((m, i) => { const k = ym(mpAno, i + 1); return `<button type="button" data-mpk="${k}" class="${k === sel ? 'on' : ''}${k === hoje ? ' hoje' : ''}">${m}</button>`; }).join('')}</div>
    ${ds.opcional ? '<div class="mp-f"><button type="button" data-mpk="">Sem data</button></div>' : ''}
    ${ds.dia ? `<div class="mp-dia"><label>Dia da compra <input class="f" id="mpDia" type="text" inputmode="numeric" maxlength="2" placeholder="opcional" value="${esc(diaAtual)}" autocomplete="off"></label>
      <small>${ds.fech ? `${esc(ds.cartao)} fecha dia ${ds.fech}: compras a partir dele vão para a fatura seguinte.` : `Defina o dia de fechamento do ${esc(ds.cartao)} para usar o dia da compra.`}</small></div>` : ''}`;
}
function posicionarSeletorMes(){
  if (!mpAlvo || mp.hidden) return;
  const r = mpAlvo.getBoundingClientRect(), h = mp.offsetHeight || 230;
  let top = r.bottom + 6, left = r.left;
  if (top + h > innerHeight - 8) top = r.top - h - 6;
  if (left + 248 > innerWidth) left = innerWidth - 248;
  mp.style.top = Math.max(8, top) + 'px'; mp.style.left = Math.max(8, left) + 'px';
}
function fecharSeletorMes(){ mp.hidden = true; mpAlvo = null; }
app.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input.mesin')) abrirSeletorMes(e.target); });
app.addEventListener('click', e => { if (e.target.matches && e.target.matches('input.mesin') && mpAlvo !== e.target) abrirSeletorMes(e.target); });
app.addEventListener('focusout', e => { if (e.target === mpAlvo) setTimeout(() => { if (document.activeElement !== mpAlvo && !mp.contains(document.activeElement)) fecharSeletorMes(); }, 0); });
app.addEventListener('input', e => { if (e.target === mpAlvo) { const k = parseMes(e.target.value); if (k) { mpAno = +k.slice(0, 4); desenharSeletorMes(); } } });
app.addEventListener('keydown', e => { if (e.key === 'Escape' && mpAlvo) fecharSeletorMes(); });
mp.addEventListener('mousedown', e => { if (e.target.id !== 'mpDia') e.preventDefault(); });   // não tira o foco do campo (exceto o dia)
mp.addEventListener('focusout', () => setTimeout(() => { if (mpAlvo && document.activeElement !== mpAlvo && !mp.contains(document.activeElement)) fecharSeletorMes(); }, 0));

/* aplica o mês escolhido; com dia da compra preenchido, envia a data completa (o planner calcula a fatura) */
function escolherMes(k){
  const el = mpAlvo; if (!el) return;
  const diaEl = document.getElementById('mpDia'), dia = diaEl ? parseInt(diaEl.value, 10) : NaN;
  fecharSeletorMes();

    const [y, m] = k.split('-').map(Number), d = Math.min(dia, new Date(y, m, 0).getDate());
    el.value = `${pad2(d)}/${pad2(m)}/${y}`;

/* no campo do dia: Enter aplica no mês marcado; Esc fecha */

/* no celular as tabelas viram cartões: cada célula recebe o nome da coluna (data-label) */
function rotularTabelas(){
  app.querySelectorAll('.tw table:not(.cal)').forEach(t => {
    const cab = t.tHead && t.tHead.rows[0]; if (!cab) return;
    const nomes = []; [...cab.cells].forEach(th => { for (let k = 0; k < (th.colSpan || 1); k++) nomes.push(th.textContent.trim()); });
    [...t.tBodies].forEach(tb => [...tb.rows].forEach(tr => {
      let col = 0;
      [...tr.cells].forEach(td => { const sp = td.colSpan || 1; if (sp === 1 && nomes[col] && !td.hasAttribute('data-label')) td.setAttribute('data-label', nomes[col]); col += sp; });
    }));
  });
}

const listas = () => ({ganhos:S.ganhos, fixos:S.fixos, fundos:S.fundos, caixa:S.caixa, cartoes:S.cartoes, parcelas:S.parcelas, ativos:S.reserva.ativos,

const NUM = new Set(['valor', 'pct', 'meta', 'saldo', 'ganhos', 'fixos', 'reserva', 'tetoPct', 'diaPagamento', 'qtd', 'preco', 'valorManual', 'pctCDI']);

app.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.tipo !== undefined) { renomearTipo(el.dataset.tipo, el.value.trim()); return commit(); }
  if (el.dataset.tipocor !== undefined) { S.tiposCor[el.dataset.tipocor] = el.value; return commit(); }
  if (el.dataset.cor !== undefined) { S.ui.cores[el.dataset.cor] = el.value; return commit(); }
  if (el.dataset.act === 'quitadas') { S.ui.mostrarQuitadas = el.checked; return commit(); }
  if (el.dataset.cmp !== undefined) { S.ui.invCmp[el.dataset.cmp] = el.checked; return commit(); }

  const set = el.dataset.set; if (!set) return;
  const [col, id, field] = set.split(':');
  if (col === 'parcelas' && field === 'inicio') {
    const d = parseData(el.value);
    if (d) {
      const o = S.parcelas.find(x => x.id === id); if (!o) return;
      if (!aplicarCompra(o, d)) { avisar('O término não pode ser antes do início.', {erro:true}); return agendar(); }
      return commit();
    }
  }
  let value;
  if (el.type === 'checkbox') value = el.checked;
  else if (el.type === 'radio') value = true;
  else if (field === 'ultima' || field === 'mesAtual' || field === 'mes' || field === 'inicio') {
    value = parseMes(el.value);
    if (value === null || ((field === 'mesAtual' || field === 'inicio' || field === 'ultima') && !value)) {
      avisar(field === 'inicio' ? 'Informe o mês da 1ª parcela.'
           : field === 'ultima' ? 'Informe o mês da última parcela (para despesa sem fim, use ↻ Recorrente).'
           : 'Mês inválido. Use AAAA-MM, por exemplo 2027-03.', {erro:true});
      return agendar();
    }
  }
  else if (field === 'nParc') {
    value = parseInt(String(el.value).replace(/\D/g, ''), 10);
    if (!(value >= 1 && value <= 600)) { avisar('Informe em quantas vezes foi parcelado (1 ou mais).', {erro:true}); return agendar(); }
  }
  else if (NUM.has(field)) {
    value = parseNum(el.value);
    if (Number.isNaN(value)) { avisar('Valor inválido: ' + el.value, {erro:true}); return agendar(); }
  }
  else value = el.value;

  if (col === 'pagas') {   // mini calendário: parcelas pagas no mês "field" da parcela "id"
    const p = S.parcelas.find(x => x.id === id); if (!p) return;
    const txt = String(el.value).trim(); p.pagas = p.pagas || {};
    if (txt === '') delete p.pagas[field];
    else {
      let n = parseInt(txt.replace(/\D/g, ''), 10);
      if (!(n >= 0)) { avisar('Use o número de parcelas pagas no mês (0, 1, 2…).', {erro:true}); return agendar(); }
      const antes = (cron(p).meses[field] || {}).antes;
      if (antes != null && n > antes) { avisar(`Em ${mesAbrev(field)} só faltavam ${antes} parcela(s).`, {erro:true}); n = antes; }
      if (field < S.config.mesAtual && n === 1) delete p.pagas[field]; else p.pagas[field] = n;
    }
    return commit();
  }
  if (col === 'proj' || col === 'real') {
    const m = S.anual[col][id] || (S.anual[col][id] = {});
    if (value == null) delete m[field]; else m[field] = value;
    if (!Object.keys(m).length) delete S.anual[col][id];
  }
  else if (col === 'root') S[field] = value ?? 0;
  else if (col === 'res') S.reserva[field] = value ?? 0;
  else if (col === 'cfg') {
    if (field === 'diaPagamento') value = Math.max(1, Math.min(31, Math.round(value ?? 10)));
    if (field === 'cotacoesUrl') {
      value = String(value || '').trim();
      if (value && !/^https:\/\//.test(value)) { avisar('O endereço precisa começar com https://', {erro:true}); return agendar(); }
      M.erros = {}; mkt.tentativa = 0; mkt.offline = false;
    }
    S.config[field] = value;
    if (field === 'mesAtual') S.ui.ano = +value.slice(0, 4);
    if (field === 'cotacoesUrl') { commit(); atualizarCotacoes(true); return; }
  }
  else {
    const o = (listas()[col] || []).find(x => x.id === id); if (!o) return;
    if (col === 'aportes' && field === 'valor') { o.valor = value ?? 0; o.fixo = 'valor'; }
    else if (col === 'aportes' && field === 'qtd') { o.qtd = value ?? 0; o.fixo = 'qtd'; }
    else if (col === 'aportes' && field === 'preco') { o.preco = value; o.precoAuto = value == null; }
    else if ((col === 'aportes' || col === 'resap') && field === 'data') {
      const d = parseData(value); if (!d) { avisar('Data inválida. Use DD/MM/AAAA.', {erro:true}); return agendar(); }
      o.data = d; commit();
      if (col === 'aportes') atualizarCotacoes(false); else atualizarJuros(false);
      return;
    }
    else if (col === 'inv' && field === 'ticker') {
      const msg = tickerPermitido(o, value);
      if (msg) { avisar(msg, {erro:true}); return agendar(); }
      o.ticker = String(value).trim().toUpperCase(); delete M.erros[simbolo(o)];
      commit(); atualizarCotacoes(false); return;
    }
    else if (col === 'inv' && field === 'classeId') { o.classeId = value; commit(); atualizarCotacoes(false); return; }
    else if (col === 'inv' && field === 'valorManual') o.valorManual = value;
    else if (col === 'classes' && field === 'auto') o.manual = !value;
    else if (col === 'parcelas' && field === 'cartaoId') { o.cartaoId = value; if (o.dataCompra) aplicarCompra(o, o.dataCompra); }
    else if (col === 'cartoes' && field === 'vencimento') {
      const n = parseInt(String(value ?? '').replace(/\D/g, ''), 10);
      if (String(value ?? '').trim() && !(n >= 1 && n <= 31)) { avisar('Dia de vencimento entre 1 e 31.', {erro:true}); return agendar(); }
      o.vencimento = n >= 1 && n <= 31 ? n : null;
    }
    else if (col === 'cartoes' && field === 'fechamento') {
      const n = parseInt(String(value ?? '').replace(/\D/g, ''), 10);
      if (String(value ?? '').trim() && !(n >= 1 && n <= 31)) { avisar('Dia de fechamento entre 1 e 31.', {erro:true}); return agendar(); }
      o.fechamento = n >= 1 && n <= 31 ? n : null;
      S.parcelas.filter(x => x.cartaoId === o.id && x.dataCompra).forEach(x => aplicarCompra(x, x.dataCompra));
    }
    else if (col === 'parcelas' && (field === 'inicio' || field === 'ultima' || field === 'nParc')) {
      // início, nº de parcelas e término: os dois últimos digitados definem o terceiro
      const antes = {inicio:o.inicio, ultima:o.ultima, nParc:o.nParc, fixos:o.fixos, dataCompra:o.dataCompra};
      o[field] = value;
      if (field === 'inicio') delete o.dataCompra;
      if (o.ultima) {
        o.fixos = [field, ...(o.fixos || ['ultima', 'inicio']).filter(f => f !== field)].slice(0, 2);
        if (!recalcParcela(o)) { Object.assign(o, antes); avisar('O término não pode ser antes do início.', {erro:true}); return agendar(); }
      }
      if (o.dataCompra && o.inicio !== faturaDaCompra(o.cartaoId, o.dataCompra)) delete o.dataCompra;
    }
    else if (field === 'valor') { o.valor = value ?? 0; if ('modo' in o) o.modo = 'valor'; }
    else if (field === 'pct') { o.pct = value ?? 0; o.modo = 'pct'; }
    else if (field === 'isReserva') { S.fundos.forEach(f => f.reserva = false); o.reserva = true; }
    else if (col === 'parcelas' && field === 'tipo') { o.tipo = value.trim(); addTipo(o.tipo); }
    else if (NUM.has(field)) o[field] = value ?? 0;
    else o[field] = value;
  }
  commit();
});

/* data da compra -> início = fatura em que cai a 1ª parcela; o início passa a ser um dos dois campos digitados */
function aplicarCompra(p, iso){
  const antes = {inicio:p.inicio, ultima:p.ultima, nParc:p.nParc, fixos:p.fixos, dataCompra:p.dataCompra};
  p.dataCompra = iso; p.inicio = faturaDaCompra(p.cartaoId, iso);
  if (p.ultima) {
    p.fixos = ['inicio', ...(p.fixos || ['ultima', 'inicio']).filter(f => f !== 'inicio')].slice(0, 2);
    if (!recalcParcela(p)) { Object.assign(p, antes); return false; }
  }
  return true;
}
/* recalcula o campo da parcela que não foi digitado (o que não está em p.fixos) */
function recalcParcela(p){
  const fx = p.fixos || ['ultima', 'inicio'], calc = ['inicio', 'nParc', 'ultima'].find(f => !fx.includes(f));
  const n = Math.max(1, Math.round(p.nParc || 1));
  if (calc === 'nParc') { const m = monthsBetween(p.inicio, p.ultima) + 1; if (m < 1) return false; p.nParc = m; }
  else if (calc === 'ultima') p.ultima = addMonths(p.inicio, n - 1);
  else if (calc === 'inicio') p.inicio = addMonths(p.ultima, -(n - 1));
  return true;
}

function addTipo(t){
  if (!t || S.tipos.includes(t)) return;
  S.tipos.push(t); S.tipos.sort((a, b) => a.localeCompare(b, 'pt-BR'));
  if (!S.tiposCor[t]) S.tiposCor[t] = proximaCor(Object.values(S.tiposCor));
}
function renomearTipo(velho, novo){
  if (!novo || novo === velho) return;
  S.parcelas.forEach(p => { if (p.tipo === velho) p.tipo = novo; });
  const cor = S.tiposCor[velho];
  S.tipos = S.tipos.filter(t => t !== velho); delete S.tiposCor[velho];
  if (!S.tipos.includes(novo)) { S.tipos.push(novo); S.tipos.sort((a, b) => a.localeCompare(b, 'pt-BR')); }
  if (!S.tiposCor[novo]) S.tiposCor[novo] = cor || proximaCor(Object.values(S.tiposCor));
}
