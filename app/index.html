      if (col === 'carteiras') { novaCarteira(); return; }
      const o = NOVOS[col](arg); L.push(o);
      focoPendente = `${col}:${o.id}:${CAMPO_FOCO[col] || 'nome'}`;
      if (col === 'carteiras') S.ui.invCarteira = o.id;
      return commit();
    }
    case 'abrir': S.ui.abertos[id] = !S.ui.abertos[id]; return commit();
    case 'cal': S.ui.cal = {...S.ui.cal, [id]: !S.ui.cal[id]}; return commit();
    case 'pago': {   // checklist da aba Contas
      e.preventDefault();   // dentro do resumo do cartão, não abre/fecha a lista
      const i = arg.indexOf('|'), m = arg.slice(0, i), key = arg.slice(i + 1), agora = b.getAttribute('aria-pressed') !== 'true';
      S.contasPagas = S.contasPagas || {};
      const mm = S.contasPagas[m] = S.contasPagas[m] || {};
      if (key.startsWith('cartao:')) mm[key] = agora;   // fatura: guarda sim/não (sem marcação, vale o vencimento)
      else if (agora) mm[key] = true; else delete mm[key];
      return commit();
    }
    case 'instalar':
      if (promptInstalar) { promptInstalar.prompt(); promptInstalar.userChoice.finally(() => { promptInstalar = null; agendar(); }); }
      return;
    case 'testaCot': testarCotacoes(); return;
    case 'contasMes': S.ui.contasOff = Math.max(0, Math.min(12, (Number(S.ui.contasOff) || 0) + Number(arg))); return commit();
    case 'addquit': {   // compra antiga já paga: termina no mês anterior ao em edição
      const k = addMonths(S.config.mesAtual, -1);
      const o = {id:uid(), nome:'Compra quitada', cartaoId:(S.cartoes[0] || {}).id || '', tipo:'', valor:0, inicio:k, nParc:1, ultima:k, fixos:['ultima', 'nParc']};
      S.parcelas.push(o); focoPendente = `parcelas:${o.id}:nome`;
      return commit();
    }
    case 'cotacoes': atualizarCotacoes(true); return;
    case 'juros': atualizarJuros(true); return;
    case 'patModo': S.ui.patModo = arg; return commit();
    case 'invCart': S.ui.invCarteira = arg; return commit();
    case 'per': { const [ch, v] = arg.split('|'); S.ui.per = {...S.ui.per, [ch]: v}; return commit(); }
    case 'del': {
      if (!L || !L.some(x => x.id === id)) return;
      const item = L.find(x => x.id === id), nome = item.nome || item.produto || 'Item';
      const snap = JSON.stringify(S);
      const remover = () => {
        const lista = listas()[col], i = lista.findIndex(x => x.id === id); if (i < 0) return;
        lista.splice(i, 1);
        if (col === 'cartoes') S.parcelas = S.parcelas.filter(p => p.cartaoId !== id);
        if (col === 'fundos') S.caixa.forEach(c => { if (c.fundoId === id) c.fundoId = ''; });
        if (col === 'inv') S.aportes = S.aportes.filter(a => a.ativoId !== id);
        if (col === 'ativos') S.resAportes = S.resAportes.filter(a => a.ativoId !== id);
        if (col === 'carteiras') {
          const ids = new Set(S.invAtivos.filter(a => a.carteiraId === id).map(a => a.id));
          S.invAtivos = S.invAtivos.filter(a => !ids.has(a.id)); S.aportes = S.aportes.filter(a => !ids.has(a.ativoId));
          if (!S.carteiras.length) S.carteiras.push(NOVOS.carteiras());
          if (S.ui.invCarteira === id) S.ui.invCarteira = 'todas';
        }
        const rot = col === 'inv' ? (item.ticker || item.nome || 'Ativo') : (col === 'aportes' || col === 'resap') ? 'Aporte' : nome;
        avisar(`“${rot}” removido`, {desfazer: snap});
        commit();
      };
      if (col === 'cartoes' && S.parcelas.some(p => p.cartaoId === id)) {
        const n = S.parcelas.filter(p => p.cartaoId === id).length;
        pedir({titulo:`Remover o cartão “${nome}”?`, html:`<p>As ${n} parcela(s) deste cartão também serão removidas.</p>`, ok:'Remover', perigo:true}).then(ok => { if (ok) remover(); });
      } else if (col === 'carteiras' && S.invAtivos.some(a => a.carteiraId === id)) {
        const n = S.invAtivos.filter(a => a.carteiraId === id).length;
        pedir({titulo:`Remover a carteira “${nome}”?`, html:`<p>Os ${n} ativo(s) desta carteira e todos os aportes deles também serão removidos.</p>`, ok:'Remover', perigo:true}).then(ok => { if (ok) remover(); });
      } else remover();
      return;
    }
    case 'rec': {
      const p = S.parcelas.find(x => x.id === id); if (!p) return;
      if (p.ultima) { p.ultimaAnterior = p.ultima; p.ultima = ''; }
      else {
        p.ultima = p.ultimaAnterior && p.ultimaAnterior >= (p.inicio || '') ? p.ultimaAnterior : (p.inicio || S.config.mesAtual);
        if (!recalcParcela(p)) p.nParc = 1;
      }
      return commit();
    }
    case 'up': case 'down': {
      const i = L.findIndex(x => x.id === id), j = act === 'up' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= L.length) return;
      [L[i], L[j]] = [L[j], L[i]]; return commit();
    }
    case 'addtipo':
      pedir({titulo:'Novo tipo de gasto', campo:'Ex.: Lazer', ok:'Adicionar'}).then(t => { if (t) { addTipo(t); commit(); } });
      return;
    case 'deltipo': S.tipos = S.tipos.filter(t => t !== arg); delete S.tiposCor[arg]; return commit();
    case 'ano': S.ui.ano += Number(arg); return commit();
    case 'amodo': S.ui.anualModo = arg; return commit();
    case 'dmodo': S.ui.dividaModo = arg; return commit();
    case 'fechar': return fecharMes();
    case 'preencher': return preencherProjecao(S.ui.ano);
    case 'export': return exportar();
    case 'import': return document.getElementById('fileImp').click();
    case 'reset':
      pedir({titulo:'Começar do zero?', ok:'Apagar tudo', perigo:true, html: syncLigado()
               ? '<p>Todos os dados serão apagados deste aparelho e do Google Drive (e dos outros aparelhos conectados).</p><div class="nota">Uma cópia do que existe hoje fica guardada na pasta Versões do Drive.</div>'
               : '<p>Todos os dados serão apagados deste aparelho.</p><div class="nota">Isso não pode ser desfeito. Exporte um backup antes, se quiser guardar o que tem hoje.</div>'})
        .then(async ok => { if (!ok) return; await copiaDeSeguranca('antes de começar do zero'); S = migrar(estadoVazio()); commit(); });
      return;
  }
});

/* ============================================================
   Fechar mês, projeção, backup
   ============================================================ */
async function fecharMes(){
  const c = calc(), mes = c.mes;
  const semFundo = c.caixa.filter(x => x.it.tipo === 'aporte' && !S.fundos.some(f => f.id === x.it.fundoId)).length;
  const notas = [];
  if (S.anual.real[mes]) notas.push(`Já existem valores reais para ${mesLabel(mes)}; eles serão substituídos pelos do fechamento.`);
  if (semFundo) notas.push(`${semFundo} aporte(s) do caixa estão sem fundo destino e não vão somar em nenhum saldo.`);
  const ok = await pedir({titulo:`Fechar ${mesLabel(mes)}?`, ok:'Fechar mês', html:`<ul>
      <li>O mês vai para o calendário Real (editável depois)</li>
      <li>Cada fundo soma o aporte do mês ao saldo</li>
      <li>Os lançamentos do caixa ficam no histórico e a lista é zerada</li>
      <li>O mês em edição passa a ser ${mesLabel(addMonths(mes, 1))}</li></ul>
      <p style="margin-top:10px">Confira antes se a aba Reserva está atualizada.</p>${notas.map(n => `<div class="nota">${esc(n)}</div>`).join('')}`});
  if (!ok) return;

  const snap = JSON.stringify(S);
  const res = reservaTotal();
  S.anual.real[mes] = {ganhos:c.arrec, fixos:c.totalFixos, reserva:res};
  S.patrimonioHist[mes] = {reserva:res, invest:valorInvestimentos(), bens:totalBens(), divida:saldoDevedorEm(mes)};
  S.historico[mes] = {
    fechadoEm: new Date().toISOString(),
    resumo: {arrec:c.arrec, totalFixos:c.totalFixos, primario:c.primario, totalFundos:c.totalFundos, superavit:c.superavit,
             rendas:c.rendas, gastos:c.gastos, aportes:c.aportes, totalCaixa:c.totalCaixa, reserva:res},
    ganhos: S.ganhos.map(g => ({nome:g.nome, v:Number(g.valor) || 0})),
    fixos: c.fixos.map(f => ({nome:f.it.nome, v:f.v})),
    fundos: c.fundos.map(f => ({nome:f.it.nome, v:f.v})),
    caixa: c.caixa.map(x => ({nome:(x.it.tipo === 'renda' ? '+ ' : '− ') + x.it.nome, v:x.v})),
    parcelas: parcelasAtivas(mes).map(p => ({nome:p.nome, v:pagamentoEm(p, mes), cartao:(S.cartoes.find(k => k.id === p.cartaoId) || {}).nome || ''})),
  };
  c.fundos.forEach(f => { if (!f.it.reserva) f.it.saldo = (Number(f.it.saldo) || 0) + f.v; });
  c.caixa.forEach(x => {
    if (x.it.tipo !== 'aporte') return;
    const fd = S.fundos.find(f => f.id === x.it.fundoId);
    if (fd && !fd.reserva) fd.saldo = (Number(fd.saldo) || 0) + x.v;
  });
  S.caixa = [];
  S.config.mesAtual = addMonths(mes, 1);
  S.ui.ano = +S.config.mesAtual.slice(0, 4);
  avisar(`${mesLabel(mes)} fechado`, {desfazer: snap});
  commit();
}

async function preencherProjecao(ano){
  const atual = S.config.mesAtual, fim = ym(ano, 12);
  if (fim < atual) { avisar(`Só dá para projetar a partir de ${mesLabel(atual)}.`, {erro:true}); return; }
  const ini = ano === +atual.slice(0, 4) ? atual : ym(ano, 1);
  const ok = await pedir({titulo:'Preencher a projeção?', ok:'Preencher',
    html:`<p>Os meses de ${mesLabel(ini)} a ${mesLabel(fim)} serão calculados a partir do orçamento atual: ganhos de hoje, gastos caindo conforme as parcelas terminam e a reserva crescendo com o aporte do fundo Reserva.</p><div class="nota">Os valores projetados desses meses serão substituídos.</div>`});
  if (!ok) return;
  const snap = JSON.stringify(S);
  let res = reservaTotal();
  for (let k = atual; k <= fim; k = addMonths(k, 1)) {
    const c = calc(k);
    if (k !== atual) { const fr = c.fundos.find(f => f.it.reserva); res += fr ? fr.v : 0; }
    if (k >= ini) S.anual.proj[k] = {ganhos:c.arrec, fixos:c.totalFixos, reserva:Math.round(res * 100) / 100};
  }
  avisar('Projeção preenchida', {desfazer: snap});
  commit();
}

/* diálogo próprio (o painel do app bloqueia confirm/alert/prompt nativos) */
const dlg = document.getElementById('dlg');
/* coletar: devolve todos os campos do formulário ({nome: valor}) em vez de true/false */
function pedir({titulo, html = '', ok = 'Confirmar', perigo = false, campo = null, coletar = false}){
  return new Promise(resolve => {
    dlg.innerHTML = `<form><h3>${esc(titulo)}</h3>${html}${campo ? `<input class="f" type="text" name="v" placeholder="${esc(campo)}" autocomplete="off">` : ''}
      <div class="row"><button type="button" class="btn" data-dlg="cancel">Cancelar</button><button type="submit" class="btn ${perigo ? 'perigo' : 'primary'}">${esc(ok)}</button></div></form>`;
    const form = dlg.querySelector('form');
    let feito = false;
    const fim = confirmou => {
      if (feito) return; feito = true;
      const v = coletar ? (confirmou ? Object.fromEntries(new FormData(form)) : null)
              : campo ? (confirmou ? (form.v.value || '').trim() : null) : confirmou;
      if (dlg.open) dlg.close();
      resolve(v);
    };
    form.onsubmit = e => { e.preventDefault(); fim(true); };
    dlg.querySelector('[data-dlg=cancel]').onclick = () => fim(false);
    dlg.oncancel = () => fim(false);   // tecla Esc
    dlg.onclose = () => fim(false);
    dlg.showModal();
    (campo ? form.v : form.querySelector('input[type=text]') || dlg.querySelector('button[type=submit]')).focus();
  });
}

/* nova carteira: a moeda é escolhida aqui e não muda depois (define que ativos podem entrar) */
async function novaCarteira(){
  const r = await pedir({titulo:'Nova carteira', ok:'Criar carteira', coletar:true, html:`
    <p>A moeda define o que pode entrar na carteira e não muda depois.</p>
    <input class="f" type="text" name="nome" placeholder="Nome da carteira (opcional)" autocomplete="off">
    <div class="opcs">
      <label class="opc"><input type="radio" name="moeda" value="BRL" checked><span><b>R$ Real</b><small>Só ativos brasileiros da B3: ações, FIIs, ETFs e BDRs, além de CDB e Tesouro.</small></span></label>
      <label class="opc"><input type="radio" name="moeda" value="USD"><span><b>US$ Dólar</b><small>Só ativos internacionais: stocks e ETFs (ex.: AAPL, VOO, MSFT).</small></span></label>
      <label class="opc"><input type="radio" name="moeda" value="BTC"><span><b>₿ Bitcoin</b><small>Só bitcoin. Em cada aporte você informa a data e quantos BTC comprou ou quanto pagou em R$ ou US$.</small></span></label>
    </div>`});
  if (!r) return;
  const moeda = ['BRL', 'USD', 'BTC'].includes(r.moeda) ? r.moeda : 'BRL';
  const nome = (r.nome || '').trim() || {BRL:'Carteira em reais', USD:'Carteira em dólar', BTC:'Bitcoin'}[moeda];
  const c = {id:uid(), nome, moeda};
  S.carteiras.push(c);
  if (moeda === 'BTC') {
    let cl = S.classes.find(x => x.mercado === 'CRIPTO');
    if (!cl) { cl = {id:uid(), nome:'Cripto', cor:proximaCor(S.classes.map(x => x.cor)), mercado:'CRIPTO', manual:false}; S.classes.push(cl); }
    const id = uid(); S.ui.abertos[id] = true;
    S.invAtivos.push({id, carteiraId:c.id, ticker:'BTC', classeId:cl.id, nome:'Bitcoin', valorManual:null});
  }
  S.ui.invCarteira = c.id;
  commit(); atualizarCotacoes(false);
}

/* o ticker combina com a moeda da carteira? (R$ = B3, US$ = exterior, ₿ = só BTC) */
function tickerPermitido(a, ticker){
  const ref = refDe(a), t = String(ticker || '').trim().toUpperCase(), cl = classeDe(a);
  if (!t || (cl && cl.manual)) return null;
  const b3 = /\.SA$/.test(t) || /^[A-Z]{4}\d{1,2}[A-Z]?$/.test(t);
  if (ref === 'BRL' && !b3) return 'Na carteira em reais só entram ativos da B3 (ex.: PETR4, HGLG11, BOVA11).';
  if (ref === 'USD' && b3) return 'Na carteira em dólar só entram ativos internacionais (ex.: AAPL, VOO, MSFT).';
  if (ref === 'USD' && /-(USD|BRL|EUR)$/.test(t)) return 'Cripto fica na carteira em bitcoin.';
  if (ref === 'BTC' && !/^BTC(-USD)?$/.test(t)) return 'A carteira em bitcoin só aceita BTC.';
  return null;
}

/* ============================================================
   Sincronização pelo Google Drive
   O script do planner (planner-apps-script.gs), publicado na conta Google do usuário, guarda os dados
   num arquivo do Drive. Cada mudança é enviada na hora; as dos outros aparelhos chegam ao abrir o app,
   ao voltar para ele e a cada minuto. "rev" é a versão: se a nuvem andou e este aparelho também, há conflito.
   ============================================================ */
const SYNC_KEY = 'planner-sync-v1';
const SITE = 'https://fewa151-dev.github.io/planner-financeiro/';
/* fica só neste aparelho: endereço do script, chave, versão (rev) que este aparelho tem e se há mudança por enviar */
let SY = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } })();
const salvarSY = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch (e) {} };
const syncLigado = () => !!(SY.url && SY.chave);
const sy = {estado: syncLigado() ? 'verificando' : 'off', msg:'', enviando:false, buscando:false, perguntando:false, denovo:false, tEnvio:null};
const ROT_SYNC = {off:'Desligada', verificando:'Verificando…', ok:'Sincronizado', pendente:'Mudanças por enviar', enviando:'Enviando…',
                  offline:'Sem conexão', erro:'Erro na sincronização', conflito:'Mudanças em dois aparelhos'};

const nomeAparelho = () => SY.aparelho || (/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 'Celular' : 'Computador');
const dataHora = x => new Date(x).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
/* hash curto do conteúdo (cyrb53): diz se há mudança que a nuvem ainda não tem */
function hashTxt(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
/* vai para a nuvem tudo, menos o estado de tela deste aparelho (aba aberta, painéis, períodos…); as cores dos gráficos vão junto */
const dadosNuvem = () => ({...S, ui:{cores:S.ui.cores}});
const hashLocal = () => hashTxt(JSON.stringify(dadosNuvem()));
function aplicarNuvem(d){
  S = migrar({...d, ui:{...S.ui, cores:{...S.ui.cores, ...((d.ui && d.ui.cores) || {})}}});
  memoCron = {}; memoRes = {}; salvar();
  SY.hash = hashLocal(); SY.pendente = false;
}
const temDados = () => !!(S.ganhos.length || S.parcelas.length || S.reserva.ativos.length || S.invAtivos.length || S.bens.length
                          || S.caixa.length || Object.keys(S.historico).length);

async function nuvem(acao, extra = {}, alvo = SY){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 40000);
  let r;
  try { r = await fetch(alvo.url, {method:'POST', body:JSON.stringify({acao, chave:alvo.chave, ...extra}), signal:ctl.signal}); }
  catch (e) { throw Object.assign(new Error(navigator.onLine === false ? 'Sem internet: as mudanças ficam guardadas e vão quando a conexão voltar.' : 'Sem resposta do script do Google.'), {rede:true}); }
  finally { clearTimeout(t); }
  let j;
  try { j = await r.json(); }
  catch (e) { throw new Error('O script não respondeu como esperado. Confira se ele tem o código novo e foi implantado como "Qualquer pessoa".'); }
  if (j && j.erro) throw new Error(j.erro);
  return j;
}

function tituloPerfil(){ return syncLigado() ? `${SY.conta || 'Google Drive'} · ${ROT_SYNC[sy.estado]}` : 'Conectar ao Google Drive'; }
function perfilHTML(cls = ''){
  const ini = syncLigado() && SY.conta ? SY.conta[0].toUpperCase() : 'P';
  return `<button type="button" class="perfil ${cls}" data-act="perfil" data-st="${sy.estado}" title="${esc(tituloPerfil())}" aria-label="${esc(tituloPerfil())}">${esc(ini)}<i></i></button>`;
}
function sitHTML(){
  const c = {ok:'pos', erro:'neg', conflito:'neg'}[sy.estado] || '';
  return `<span class="${c}" style="font-weight:700">${esc(ROT_SYNC[sy.estado])}</span>${sy.msg ? `<div class="hint" style="margin:2px 0 0">${esc(sy.msg)}</div>` : ''}`;
}
/* muda a bolinha do perfil e o card de Ajustes sem redesenhar a página (não atrapalha quem está digitando) */
function estadoSync(e, msg = ''){
  const antes = sy.estado; sy.estado = e; sy.msg = msg;
  document.querySelectorAll('.perfil').forEach(el => { el.dataset.st = e; el.title = tituloPerfil(); el.setAttribute('aria-label', tituloPerfil()); });
  const sit = document.getElementById('syncSit'); if (sit) sit.innerHTML = sitHTML();
  const q = document.getElementById('syncQuando'); if (q && SY.ultima) q.textContent = dataHora(SY.ultima);
  if (S.ui.tab === 'config' && (antes === 'conflito') !== (e === 'conflito')) agendarFundo();
}

/* chamado a cada commit(): se o conteúdo mudou (não só a tela), envia em seguida */
function marcarMudanca(){
  if (!syncLigado()) return;
  if (hashLocal() === SY.hash) return;
  SY.pendente = true; salvarSY();
  if (sy.estado === 'conflito') return;
  estadoSync('pendente');
  clearTimeout(sy.tEnvio); sy.tEnvio = setTimeout(enviarNuvem, 1500);
}

async function enviarNuvem({forcar = false} = {}){
  if (!syncLigado() || (sy.estado === 'conflito' && !forcar)) return;
  if (sy.enviando) { sy.denovo = true; return; }
  if (!SY.pendente && !forcar) return;
  clearTimeout(sy.tEnvio);
  sy.enviando = true; estadoSync('enviando');
  const dados = dadosNuvem(), h = hashTxt(JSON.stringify(dados));
  let conf = null;
  try {
    const r = await nuvem('enviar', {baseRev:SY.rev || 0, dispositivo:nomeAparelho(), hash:h, dados, forcar});
    if (r.conflito) conf = r;
    else {
      SY.rev = r.rev; SY.atualizado = r.atualizado; SY.ultima = Date.now(); SY.hash = h;
      SY.pendente = hashLocal() !== h; salvarSY();
      estadoSync(SY.pendente ? 'pendente' : 'ok');
    }
  } catch (e) { estadoSync(e.rede ? 'offline' : 'erro', e.message); }
  finally { sy.enviando = false; }
  if (conf) return conflito(conf);
  if (sy.denovo || (SY.pendente && sy.estado === 'pendente')) { sy.denovo = false; sy.tEnvio = setTimeout(enviarNuvem, 800); }
}

/* espera o usuário terminar o que está fazendo (campo em foco, diálogo aberto, clique) antes de trocar os dados da tela */
function ocupado(){
  const a = document.activeElement;
  return dlg.open || mouseDown || !!(a && app.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
}
async function esperarLivre(){ for (let i = 0; i < 90 && ocupado(); i++) await new Promise(r => setTimeout(r, 1000)); }

async function buscarNuvem({avisarOk = false} = {}){
  if (!syncLigado() || sy.enviando || sy.buscando || sy.perguntando) return;
  if (sy.estado === 'conflito') { if (avisarOk) resolverConflito(); return; }
  sy.buscando = true;
  let proximo = null;
  try {
    if (sy.estado !== 'pendente' && sy.estado !== 'ok') estadoSync('verificando');
    const info = await nuvem('info');
    if (info.conta && info.conta !== SY.conta) { SY.conta = info.conta; salvarSY(); }
    // um envio feito ao fechar o app chegou, mas a resposta não: a nuvem já tem exatamente o que está aqui
    if (info.rev !== (SY.rev || 0) && info.hash && info.hash === hashLocal()) { SY.rev = info.rev; SY.hash = info.hash; SY.pendente = false; salvarSY(); }
    if (!info.rev) { SY.rev = 0; SY.pendente = true; salvarSY(); proximo = 'enviar'; }
    else if (info.rev === (SY.rev || 0)) {
      SY.ultima = Date.now(); salvarSY();
      if (SY.pendente) proximo = 'enviar';
      else { estadoSync('ok'); if (avisarOk) avisar('Tudo sincronizado'); }
    }
    else if (SY.pendente) proximo = info;   // os dois lados mudaram
    else {
      const r = await nuvem('baixar');
      await esperarLivre();
      if (SY.pendente) proximo = r;
      else if (r.dados) {
        aplicarNuvem(r.dados); SY.rev = r.rev; SY.atualizado = r.atualizado; SY.ultima = Date.now(); salvarSY();
        estadoSync('ok'); agendar();
        avisar(`Dados atualizados com as mudanças de ${r.dispositivo || 'outro aparelho'}`);
      }
    }
  } catch (e) { estadoSync(e.rede ? 'offline' : 'erro', e.message); }
  finally { sy.buscando = false; }
  if (proximo === 'enviar') return enviarNuvem();
  if (proximo) return conflito(proximo);
}

/* os dois aparelhos mudaram desde a última sincronização: o usuário escolhe qual versão fica (a outra vai para Versões no Drive) */
async function conflito(r){
  if (r.hash && r.hash === hashLocal()) {   // a nuvem já tem o que está aqui (envio repetido)
    SY.rev = r.rev; SY.hash = r.hash; SY.pendente = false; salvarSY(); estadoSync('ok'); return;
  }
  estadoSync('conflito');
  if (sy.perguntando) return;
  sy.perguntando = true;
  try {
    await esperarLivre();
    const quem = r.dispositivo ? ` do aparelho <b>${esc(r.dispositivo)}</b>` : '';
    const esc1 = await pedir({titulo:'Mudanças em dois aparelhos', ok:'Continuar', coletar:true, html:`
      <p>Este aparelho tem mudanças que ainda não foram para o Drive, e o Drive recebeu outras${quem}${r.atualizado ? ` em ${dataHora(r.atualizado)}` : ''}. Qual versão fica?</p>
      <div class="opcs">
        <label class="opc"><input type="radio" name="v" value="nuvem" checked><span><b>Usar os dados do Drive</b><small>As mudanças deste aparelho ficam guardadas numa cópia na pasta Versões do Drive.</small></span></label>
        <label class="opc"><input type="radio" name="v" value="local"><span><b>Manter os deste aparelho</b><small>Substituem os do Drive. A versão do Drive fica guardada na pasta Versões.</small></span></label>
      </div>`});
    if (!esc1) { estadoSync('conflito', 'Sincronização pausada. Em Ajustes → Sincronização, toque em Resolver.'); return; }
    if (esc1.v === 'local') { SY.pendente = true; sy.estado = 'pendente'; sy.perguntando = false; return enviarNuvem({forcar:true}); }
    estadoSync('enviando');
    await nuvem('guardarVersao', {dados:dadosNuvem(), motivo:'mudanças não enviadas', dispositivo:nomeAparelho()});
    const d = await nuvem('baixar');
    aplicarNuvem(d.dados); SY.rev = d.rev; SY.atualizado = d.atualizado; SY.ultima = Date.now(); salvarSY();
    estadoSync('ok'); agendar(); avisar('Dados do Drive aplicados');
  } catch (e) { estadoSync(e.rede ? 'offline' : 'erro', e.message); }
  finally { sy.perguntando = false; }
}
async function resolverConflito(){
  try { const info = await nuvem('info'); sy.estado = 'pendente'; await conflito(info); }
  catch (e) { estadoSync(e.rede ? 'offline' : 'erro', e.message); }
}

function chaveNova(){
  const b = crypto.getRandomValues(new Uint8Array(24));
  return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
/* liga este aparelho ao script: o 1º aparelho registra uma chave nova; os outros chegam pelo link (endereço + chave) */
async function conectarNuvem(url, chave){
  url = String(url || '').trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\/\S+$/.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/\S*$/.test(url)) {
    return avisar('Cole o endereço do script: começa com https://script.google.com/ e termina em /exec.', {erro:true});
  }
  chave = chave || chaveNova();
  avisar('Conectando…');
  let info;
  try { info = await nuvem('registrar', {}, {url, chave}); }
  catch (e) { return avisar(e.message, {erro:true}); }
  const antes = SY;
  SY = {url, chave, conta:info.conta || '', aparelho:antes.aparelho, rev:0, pendente:false, hash:''};
  salvarSY();
  try {
    if (!info.rev) { SY.pendente = true; await enviarNuvem(); }
    else {
      let usar = 'nuvem';
      if (temDados()) {
        const r = await pedir({titulo:'Já existem dados no Drive', ok:'Continuar', coletar:true, html:`
          <p>O Drive já tem dados do planner${info.dispositivo ? `, enviados pelo aparelho <b>${esc(info.dispositivo)}</b>` : ''}${info.atualizado ? ` em ${dataHora(info.atualizado)}` : ''}. E os dados deste aparelho?</p>
          <div class="opcs">
            <label class="opc"><input type="radio" name="v" value="nuvem" checked><span><b>Usar os dados do Drive</b><small>O certo para um aparelho novo. Os dados atuais daqui ficam guardados numa cópia na pasta Versões.</small></span></label>
            <label class="opc"><input type="radio" name="v" value="local"><span><b>Enviar os deste aparelho</b><small>Substituem os do Drive. A versão do Drive fica guardada na pasta Versões.</small></span></label>
          </div>`});
        if (!r) { SY = {aparelho:antes.aparelho}; salvarSY(); estadoSync('off'); agendar(); return avisar('Conexão cancelada.'); }
        usar = r.v;
      }
      if (usar === 'local') { SY.rev = info.rev; SY.pendente = true; salvarSY(); await enviarNuvem({forcar:true}); }
      else {
        if (temDados()) await nuvem('guardarVersao', {dados:dadosNuvem(), motivo:'antes de conectar', dispositivo:nomeAparelho()});
        const d = await nuvem('baixar');
        aplicarNuvem(d.dados); SY.rev = d.rev; SY.atualizado = d.atualizado; SY.ultima = Date.now(); salvarSY();
        estadoSync('ok');
      }
    }
  } catch (e) { estadoSync(e.rede ? 'offline' : 'erro', e.message); }
  // o mesmo script também busca as cotações
  if (!String(S.config.cotacoesUrl || '').trim()) { S.config.cotacoesUrl = url; M.erros = {}; mkt.tentativa = 0; mkt.offline = false; commit(); atualizarCotacoes(true); }
  agendar();
  avisar(`Conectado ao Google Drive${SY.conta ? ' de ' + SY.conta : ''}`);
}

/* link para conectar outro aparelho: leva o endereço e a chave (quem tiver o link acessa os dados) */
const b64url = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function linkConexao(){
  const publicado = location.protocol === 'https:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const base = publicado ? location.origin + location.pathname.replace(/index\.html$/, '') : SITE;
  return base + '#conectar=' + b64url(JSON.stringify({u:SY.url, k:SY.chave}));
}
function mostrarLink(){
  const link = linkConexao();
  pedir({titulo:'Conectar outro aparelho', ok:'Fechar', html:`
    <p>Abra este link no outro aparelho (celular, outro PC). Ele conecta o planner de lá ao seu Google Drive, sem repetir a configuração.</p>
    <div class="linkbox"><input class="f" type="text" readonly value="${esc(link)}" id="linkCon">
      <button type="button" class="btn" data-act="copiarLink">Copiar</button>${navigator.share ? '<button type="button" class="btn" data-act="partilharLink">Enviar…</button>' : ''}</div>
    <div class="nota">Quem tiver este link consegue ver e mudar seus dados. Mande só para você mesmo (por exemplo, no seu próprio WhatsApp).</div>`});
}
function lerLinkConexao(){
  const m = location.hash.match(/^#conectar=([\w-]+)/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  let o;
  try { o = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))))); }
  catch (e) { return avisar('Link de conexão inválido.', {erro:true}); }
  if (!o || !o.u || !o.k) return avisar('Link de conexão inválido.', {erro:true});
  if (SY.url === o.u && SY.chave === o.k) return avisar('Este aparelho já está conectado.');
  pedir({titulo:'Conectar este aparelho?', ok:'Conectar', html:'<p>Este aparelho vai usar os dados do planner guardados no seu Google Drive e sincronizar as mudanças com os outros aparelhos.</p>'})
    .then(ok => { if (ok) conectarNuvem(o.u, o.k); });
}

async function versoesNuvem(){
  avisar('Buscando versões…');
  let r;
  try { r = await nuvem('versoes'); } catch (e) { return avisar(e.message, {erro:true}); }
  toastEl.hidden = true;
  if (!r.versoes.length) return avisar('Ainda não há versões guardadas. A primeira cópia diária aparece amanhã.');
  const nomeV = n => {
    const m = n.match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2})-(\d{2}) (.*))?$/); if (!m) return n;
    return m[4] ? `${m[3]}/${m[2]}/${m[1]} ${m[4]}:${m[5]} · ${m[6]}` : `${m[3]}/${m[2]}/${m[1]} · início do dia`;
  };
  const esc2 = await pedir({titulo:'Versões guardadas no Drive', ok:'Restaurar', perigo:true, coletar:true, html:`
    <p>Uma cópia por dia (como os dados estavam no início do dia) e cópias feitas antes de substituições. Ao restaurar, os dados atuais também ficam guardados.</p>
    <div class="opcs vers">${r.versoes.map((v, i) => `<label class="opc"><input type="radio" name="id" value="${esc(v.id)}"${i ? '' : ' checked'}><span><b>${esc(nomeV(v.nome))}</b><small>${Math.max(1, Math.round(v.tamanho / 1024))} KB</small></span></label>`).join('')}</div>`});
  if (!esc2 || !esc2.id) return;
  try {
    avisar('Restaurando…');
    const v = await nuvem('versao', {id:esc2.id});
    await nuvem('guardarVersao', {dados:dadosNuvem(), motivo:'antes de restaurar', dispositivo:nomeAparelho()});
    const snap = JSON.stringify(S);
    aplicarNuvem(v.dados); SY.pendente = true; salvarSY();
    await enviarNuvem({forcar:true});
    agendar(); avisar('Versão restaurada', {desfazer:snap});
  } catch (e) { avisar(e.message, {erro:true}); }
}
/* antes de apagar tudo ou importar um backup, guarda uma cópia no Drive */
async function copiaDeSeguranca(motivo){
  if (!syncLigado()) return;
  try { await nuvem('guardarVersao', {dados:dadosNuvem(), motivo, dispositivo:nomeAparelho()}); } catch (e) {}
}

function cardSync(){
  const ajuda = '<a class="lnk" href="https://github.com/fewa151-dev/planner-financeiro/blob/main/planner-apps-script.gs" target="_blank" rel="noopener">planner-apps-script.gs</a>';
  if (!syncLigado()) return card('Sincronização · Google Drive', `
    <p class="hint">Guarde os dados no seu Google Drive e use o planner no PC e no celular com os mesmos dados: o que muda num aparelho aparece nos outros.</p>
    <p class="hint">No primeiro aparelho, publique uma vez o script do planner na sua conta Google (código e passo a passo em ${ajuda}) e cole o endereço dele aqui. Nos outros aparelhos, use o link de <b>Conectar outro aparelho</b>, que aparece aqui depois de conectar o primeiro.</p>
    <label style="display:grid;gap:4px;margin-top:4px;font-size:12px;font-weight:700;color:var(--muted)">Endereço do script (termina em /exec)
      <input class="f" id="syncUrl" type="text" value="${esc(S.config.cotacoesUrl || '')}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" style="border-color:var(--line2);background:var(--field)"></label>
    <div class="cf"><button class="btn primary" data-act="syncConectar">Conectar</button></div>`,
    {dica:'Os dados ficam num arquivo da pasta “Planner Financeiro” do seu Drive, com uma cópia por dia na pasta “Versões”. O script é seu e roda na sua conta.'});
  return card('Sincronização · Google Drive', `
    <div class="kv" style="grid-template-columns:auto 1fr;align-items:center">
      <span class="muted">Conta</span><span style="font-weight:700;overflow-wrap:anywhere">${esc(SY.conta || '—')}</span>
      <span class="muted">Situação</span><span id="syncSit">${sitHTML()}</span>
      <span class="muted">Última sincronização</span><span id="syncQuando">${SY.ultima ? dataHora(SY.ultima) : '—'}</span>
      <span class="muted">Este aparelho</span><span><input class="f" id="syncNome" type="text" value="${esc(nomeAparelho())}" maxlength="30" style="max-width:220px;border-color:var(--line2);background:var(--field)"></span>
    </div>
    <div class="cf">${sy.estado === 'conflito' ? '<button class="btn primary" data-act="syncResolver">Resolver</button>' : ''}
      <button class="btn" data-act="syncAgora">Sincronizar agora</button><button class="btn" data-act="syncLink">Conectar outro aparelho</button>
      <button class="btn" data-act="syncVersoes">Versões</button><button class="btn danger" data-act="syncSair">Desconectar</button></div>`,
    {dica:'Os dados ficam num arquivo da pasta “Planner Financeiro” do seu Drive, com uma cópia por dia na pasta “Versões”. Cada mudança vai na hora; as dos outros aparelhos chegam ao abrir o app e a cada minuto.'});
}

/* ações da sincronização (os botões usam data-act, como o resto do app) */
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  switch (b.dataset.act) {
    case 'perfil':
      if (S.ui.tab !== 'config') { S.ui.tab = 'config'; animarAba = true; window.scrollTo(0, 0); commit(); }
      setTimeout(() => { const c = document.getElementById('cardSync'); if (c) c.scrollIntoView({block:'center', behavior:'smooth'}); }, 120);
      if (syncLigado()) buscarNuvem();
      return;
    case 'syncConectar': return conectarNuvem((document.getElementById('syncUrl') || {}).value);
    case 'syncAgora': if (sy.estado === 'erro' || sy.estado === 'offline') sy.estado = SY.pendente ? 'pendente' : 'ok'; return buscarNuvem({avisarOk:true});
    case 'syncResolver': return resolverConflito();
    case 'syncLink': return mostrarLink();
    case 'syncVersoes': return versoesNuvem();
    case 'syncSair':
      pedir({titulo:'Desconectar este aparelho?', ok:'Desconectar', perigo:true,
             html:'<p>Os dados continuam neste aparelho e no Drive, mas as mudanças deixam de ser sincronizadas aqui.</p>'})
        .then(ok => { if (!ok) return; SY = {aparelho:SY.aparelho}; salvarSY(); estadoSync('off'); render(); avisar('Aparelho desconectado'); });
      return;
    case 'copiarLink': {
      const el = document.getElementById('linkCon'); if (!el) return;
      const feito = () => { b.textContent = 'Copiado ✓'; };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(el.value).then(feito, () => { el.select(); document.execCommand('copy'); feito(); });
      else { el.select(); document.execCommand('copy'); feito(); }
      return;
    }
    case 'partilharLink': {
      const el = document.getElementById('linkCon'); if (!el || !navigator.share) return;
      navigator.share({title:'Conectar o Planner', text:'Abra no outro aparelho para conectar o Planner ao seu Google Drive.', url:el.value}).catch(() => {});
      return;
    }
  }
});
app.addEventListener('change', e => {
  if (e.target.id !== 'syncNome') return;
  SY.aparelho = e.target.value.trim().slice(0, 30) || undefined; salvarSY();
});
setInterval(() => { if (syncLigado() && document.visibilityState === 'visible') buscarNuvem(); }, 60000);
window.addEventListener('online', () => { if (syncLigado()) buscarNuvem(); });
/* ao sair do app (trocar de app, fechar a aba): manda o que falta mesmo que a página seja fechada */
document.addEventListener('visibilitychange', () => {
  if (!syncLigado()) return;
  if (document.visibilityState === 'visible') return buscarNuvem();
  if (!SY.pendente || sy.estado === 'conflito') return;
  const dados = dadosNuvem(), json = JSON.stringify(dados), h = hashTxt(json);
  const corpo = `{"acao":"enviar","chave":${JSON.stringify(SY.chave)},"baseRev":${SY.rev || 0},"dispositivo":${JSON.stringify(nomeAparelho())},"hash":"${h}","dados":${json}}`;
  if (corpo.length > 60000 || sy.enviando) return enviarNuvem();
  clearTimeout(sy.tEnvio);
  fetch(SY.url, {method:'POST', body:corpo, keepalive:true}).then(r => r.json()).then(r => {
    if (!r || !r.ok || !r.rev) return;
    SY.rev = r.rev; SY.atualizado = r.atualizado; SY.ultima = Date.now(); SY.hash = h; SY.pendente = hashLocal() !== h; salvarSY();
    estadoSync(SY.pendente ? 'pendente' : 'ok');
  }).catch(() => {});
});

render();
lerLinkConexao();
if (syncLigado()) buscarNuvem();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
