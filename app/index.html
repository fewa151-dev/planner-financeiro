<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner Financeiro</title>
<meta name="description" content="Orçamento, contas, dívidas, reserva, investimentos e patrimônio num só lugar.">
<meta name="theme-color" content="#060915">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icone.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#060915;
    --panel:#0d1330;
    --panel-hi:rgba(22,30,74,.78);
    --panel-lo:rgba(10,15,38,.88);
    --line:rgba(140,155,255,.11);
    --line2:rgba(140,155,255,.22);
    --ink:#eef1ff;
    --ink2:#bcc3e4;
    --muted:#7c85ad;
    --accent:#5b5ff5;
    --accent2:#8a7bff;
    --pos:#34d399;
    --neg:#f87171;
    --field:rgba(255,255,255,.035);
    --field-h:rgba(255,255,255,.07);
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font:14px/1.45 Manrope,system-ui,"Segoe UI",sans-serif;color:var(--ink);
    background:
      radial-gradient(1100px 620px at 88% -12%, rgba(91,95,245,.20), transparent 62%),
      radial-gradient(800px 520px at 0% 105%, rgba(52,211,153,.07), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

  /* ---------- estrutura ---------- */
  .shell{display:grid;grid-template-columns:92px minmax(0,1fr);min-height:100vh}
  .rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0;
        border-right:1px solid var(--line);background:rgba(6,9,21,.6);backdrop-filter:blur(8px)}
  /* perfil: inicial da conta Google conectada (ou P) com a bolinha da sincronização */
  .perfil{position:relative;flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;margin-bottom:18px;border:0;cursor:pointer;color:#fff;
          background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 22px rgba(91,95,245,.5);font-weight:800;font-size:16px}
  .perfil i{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg);display:none}
  .perfil[data-st=ok] i{display:block;background:var(--pos)}
  .perfil[data-st=pendente] i,.perfil[data-st=enviando] i,.perfil[data-st=verificando] i{display:block;background:#fbbf24;animation:pulsa 1s ease-in-out infinite}
  .perfil[data-st=offline] i{display:block;background:#7c85ad}
  .perfil[data-st=erro] i,.perfil[data-st=conflito] i{display:block;background:var(--neg)}
  .perfil.mob{display:none}
  .opcs.vers{max-height:46vh;overflow:auto;padding-right:2px}
  .linkbox{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .linkbox .f{flex:1 1 220px;font-size:12.5px!important}
  .nav{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;padding:8px 0;border:0;background:none;cursor:pointer;color:var(--muted)}
  .nav .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:.15s}
  .nav span{font-size:10.5px;font-weight:600}
  .nav:hover{color:var(--ink)} .nav:hover .ico{border-color:var(--line2)}
  .nav.on{color:var(--ink)}
  .nav.on .ico{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 0 24px rgba(91,95,245,.6);color:#fff}
  .ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  main{width:100%;max-width:1280px;margin:0 auto;padding:26px 32px 90px}

  .phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .phead h1{font-size:30px;line-height:1.1;margin:6px 0 0;font-weight:800;letter-spacing:-.01em}
  .phead .acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel-lo);color:var(--ink2);font-weight:600;font-size:13px}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 10px var(--pos)}

  .btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border-radius:12px;padding:9px 14px;border:1px solid var(--line2);background:var(--field);font-weight:600;transition:.15s}
  .btn:hover{background:var(--field-h)}
  .btn.primary{border:0;color:#fff;padding:11px 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 26px rgba(91,95,245,.45)}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.ghost{border-style:dashed;background:none;color:var(--ink2)}
  .btn.ghost:hover{color:var(--ink);border-color:var(--accent)}
  .btn.danger{color:var(--neg);border-color:rgba(248,113,113,.35)}
  .btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .navbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel-lo);cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
  .navbtn:hover{color:var(--ink);border-color:var(--line2)}

  /* ---------- cards ---------- */
  .card{background:linear-gradient(180deg,var(--panel-hi),var(--panel-lo));border:1px solid var(--line);border-radius:var(--r);
        padding:18px 20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 14px 36px rgba(0,0,0,.32);min-width:0}
  .ch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .ch h2{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:0;display:flex;align-items:center;gap:8px}
  .ch .tot{font-size:20px;font-weight:800}
  .ch .tot.hl{font-size:28px;letter-spacing:-.01em}
  .cf{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .info{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);display:inline-grid;place-items:center;font-size:11px;color:var(--muted);cursor:help;text-transform:none;letter-spacing:0}
  .grid{display:grid;gap:16px;margin-bottom:16px;align-items:start}
  .g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
  .g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  .g-1-1{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .stack>*+*{margin-top:16px}
  .mb{margin-bottom:16px}

  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
  .kpi{position:relative;overflow:hidden}
  .kpi .lbl{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
  .kpi .badge{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--ink2)}
  .kpi .badge svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .kpi .val{font-size:27px;font-weight:800;margin:12px 0 2px;letter-spacing:-.01em;white-space:nowrap}
  .kpi .sub{font-size:12.5px;color:var(--muted)}
  .kpi.hero{border-color:rgba(91,95,245,.45);box-shadow:0 0 0 1px rgba(91,95,245,.15),0 14px 40px rgba(40,44,160,.35)}
  .kpi.hero .badge{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff}
  .kpi .val input{font-size:27px;font-weight:800;padding:0 6px;margin-left:-6px;width:100%;text-align:left}

  .pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
  .hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}

  /* ---------- tabelas e campos ---------- */
  .tw{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 6px 8px;white-space:nowrap}
  td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:middle}
  th.r,td.r{text-align:right}
  tr.tot td{border-top:1px solid var(--line2);font-weight:800;padding-top:10px}
  tr.off td{opacity:.45}
  td.ctl{width:1%;white-space:nowrap;text-align:right}
  .rowacts{opacity:0;transition:.12s;display:inline-flex;gap:2px}
  tr:hover .rowacts,tr:focus-within .rowacts{opacity:1}
  .ib{width:26px;height:26px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;display:inline-grid;place-items:center;font-size:13px}
  .ib:hover{background:var(--field-h);color:var(--ink)}
  .ib.del:hover{color:var(--neg)}

  .f{width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:9px;padding:6px 8px;transition:background .12s,border-color .12s}
  .f:hover{background:var(--field)}
  .f:focus{outline:none;background:var(--field-h);border-color:var(--accent)}
  .f.num{text-align:right;width:112px}
  .f.sm{width:82px}
  .f.calc{color:var(--muted);font-weight:500}
  .f::placeholder{color:var(--muted);opacity:.65;font-weight:500}
  .f.lock{color:var(--ink);font-weight:700}
  .f[readonly]{color:var(--muted);cursor:default}
  .f[readonly]:hover{background:transparent}
  .f.name{font-weight:600;min-width:150px}
  table.fit{table-layout:fixed}
  table.fit .f.name{min-width:0}
  table.fit .f.num{width:100%}
  table.compacta .f.name{min-width:110px}
  table.compacta .f.num:not(.sm){width:100px}
  select.f{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
           background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px;background-repeat:no-repeat;padding-right:24px;cursor:pointer}
  select.f option{background:#121838}
  .sub2{font-size:11.5px;color:var(--muted);padding:0 9px 4px}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
  .chip input{position:absolute;opacity:0;pointer-events:none}
  .chip:has(input:checked){color:#fff;background:rgba(91,95,245,.22);border-color:rgba(91,95,245,.6)}
  .chip:has(input:focus-visible){outline:2px solid var(--accent2)}
  .tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
  .tag.renda{background:rgba(52,211,153,.14);color:var(--pos)}
  .tag.gasto{background:rgba(248,113,113,.14);color:var(--neg)}
  .tag.aporte{background:rgba(91,95,245,.2);color:#b4b6ff}

  .seg{display:inline-flex;padding:4px;border-radius:14px;border:1px solid var(--line);background:var(--panel-lo)}
  .seg button{border:0;background:none;padding:6px 12px;border-radius:10px;cursor:pointer;color:var(--ink2);font-weight:600;font-size:12.5px}
  .seg button.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 16px rgba(91,95,245,.45)}

  .meter{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;min-width:80px}
  .meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .meter.over i{background:var(--neg)}
  .meter.big{height:12px}
  .mt{font-size:11.5px;color:var(--muted);margin-top:4px}

  .kv{display:grid;grid-template-columns:1fr auto;gap:9px 16px;align-items:center}
  .kv .v{text-align:right;font-weight:700}
  .kv .sep{grid-column:1/-1;border-top:1px solid var(--line2);margin:2px 0}
  .kv .big{font-size:22px;font-weight:800}

  input[type=color].sw{appearance:none;-webkit-appearance:none;width:16px;height:16px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;flex:none}
  input[type=color].sw::-webkit-color-swatch-wrapper{padding:0}
  input[type=color].sw::-webkit-color-swatch{border:0;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
  input[type=color].sw::-moz-color-swatch{border:0;border-radius:50%}
  .dotc{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;display:inline-block}

  /* ---------- gráficos ---------- */
  .chart{position:relative;width:100%}
  .chart svg{display:block;overflow:visible}
  .chart text{font-family:inherit}
  .lc .grid{stroke:rgba(140,155,255,.09)}
  .lc .zero{stroke:rgba(140,155,255,.28)}
  .lc .ytk{fill:var(--muted);font-size:11px;text-anchor:end}
  .lc .xtk{fill:var(--muted);font-size:11px;text-anchor:middle}
  .lc .ref{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:6 5;opacity:.75}
  .lc .reflbl{fill:var(--ink2);font-size:11px;font-weight:700}
  .lc .elbl{font-size:11px;font-weight:700;fill:var(--ink2)}
  .lc .band rect{fill:transparent}
  .lc .band line{stroke:transparent;stroke-width:1}
  .lc .band:hover rect{fill:rgba(255,255,255,.03)}
  .lc .band:hover line{stroke:rgba(255,255,255,.28)}
  .lc .band circle{opacity:0;transition:opacity .12s;pointer-events:none}
  .lc .band:hover circle{opacity:1}
  .slice{transition:transform .15s;transform-box:view-box;transform-origin:center;cursor:default}
  .slice:hover{transform:scale(1.035)}
  .donut .ct1{fill:var(--muted);font-size:11px;font-weight:700;letter-spacing:.1em;text-anchor:middle}
  .donut .ct2{fill:var(--ink);font-size:20px;font-weight:800;text-anchor:middle}
  .pie-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .pie-wrap>svg{flex:none}
  .leg{list-style:none;margin:0;padding:0;flex:1;min-width:220px}
  .leg li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line)}
  .leg li:first-child{border-top:0}
  .leg .ln{font-weight:600;line-height:1.3}
  .leg .lv{white-space:nowrap}
  .leg .lv{font-weight:700}
  .leg .lp{color:var(--muted);min-width:52px;text-align:right}
  .legend-line{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink2)}
  .legend-line label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
  .legend-line .ls{display:inline-block;width:22px;border-top:2px solid var(--ink2)}
  .legend-line .ls.d{border-top-style:dashed}
  .empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;border:1px dashed var(--line2);border-radius:12px}

  #tip{position:fixed;z-index:50;pointer-events:none;padding:8px 11px;border-radius:10px;background:rgba(14,19,48,.96);border:1px solid var(--line2);
       box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:12.5px;line-height:1.45;max-width:260px}
  #tip b{display:block;font-size:12.5px;margin-bottom:1px}
  #tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
  #tip .r span:last-child{color:var(--ink);font-weight:700}

  /* ---------- contas do mês ---------- */
  .aviso-fatura{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;margin-bottom:16px;border-radius:14px;
                background:rgba(91,95,245,.12);border:1px solid rgba(91,95,245,.45);color:var(--ink2)}
  .aviso-fatura svg{width:20px;height:20px;flex:none;fill:none;stroke:#b4b6ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
  .aviso-fatura b{color:var(--ink)}
  .card.contas{max-width:820px;padding:8px 20px 16px}
  .cs{padding:14px 0 6px;border-bottom:1px solid var(--line)}
  .cs-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .cs-h h3{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
  .cs-h span{font-weight:800}
  .cl{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:7px 0}
  .cl + .cl{border-top:1px dashed var(--line)}
  .cl-n{display:flex;align-items:center;flex-wrap:wrap;gap:0 10px;font-weight:600}
  .cl-n small{color:var(--muted);font-weight:500;font-size:12px}
  .cl-v{font-weight:700;white-space:nowrap}
  .cl-fat + .cl-fat{border-top:1px dashed var(--line)}
  .cl-fat summary{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0;cursor:pointer;list-style:none}
  .cl-fat summary::-webkit-details-marker{display:none}
  .cl-fat summary .cl-n::after{content:'▾';color:var(--muted);font-size:11px}
  .cl-fat[open] summary .cl-n::after{content:'▴'}
  .cl-sub{margin:0 0 8px 20px;padding:0 0 0 12px;border-left:2px solid var(--line2)}
  .cl-sub .cl{padding:5px 0;font-size:13px}
  .cl-sub .cl-n{font-weight:500}
  .cs-tot{display:flex;justify-content:space-between;padding:14px 0 2px;font-size:18px;font-weight:800}
  .ck{flex:none;width:24px;height:24px;margin-right:12px;padding:0;border-radius:8px;border:1.5px solid var(--line2);background:none;color:transparent;display:grid;place-items:center;cursor:pointer;transition:.12s}
  .ck svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .ck:hover{border-color:var(--pos);color:rgba(52,211,153,.55)}
  .ck.on{background:var(--pos);border-color:var(--pos);color:#06231a}
  .cl .cl-n,.cl-fat summary .cl-n{flex:1}
  .cl.pago>.cl-n,.cl.pago>.cl-v,.cl-fat.pago>summary .cl-n,.cl-fat.pago>summary .cl-v{opacity:.5;text-decoration:line-through;text-decoration-thickness:1px}
  .lnk{border:0;background:none;padding:0;color:#b4b6ff;font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* ---------- antecipações ---------- */
  .antctl{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
  .antctl .recbtn{padding:2px 8px;font-size:11.5px}
  .recbtn.so-cel{display:none}            /* botão Recorrente que só aparece no celular (ao lado de Meses) */
  .dotcell{display:flex;align-items:center;gap:6px;padding-left:6px}
  tr.calrow>td{background:rgba(91,95,245,.05)}
  .mcal{display:flex;gap:4px;overflow-x:auto;padding:2px 0;width:100%}
  .mc{flex:none;width:58px;display:grid;justify-items:center;gap:1px;padding:3px 2px 4px;border-radius:10px;border:1px solid var(--line)}
  .mc span{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  .mc .mcq{width:40px;padding:1px 4px;text-align:center;font-weight:800;font-size:13px}
  .mc.pago{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.28)}
  .mc.pago span{color:var(--pos)}
  .mc.falta{border-color:rgba(248,113,113,.45)}
  .mc.falta span{color:var(--neg)}
  .mc.atual{border-color:rgba(91,95,245,.75);background:rgba(91,95,245,.12)}
  .mc.atual span{color:#c9caff}
  .mc.futuro .mcq{color:var(--muted)}
  .mc.extra{background:rgba(91,95,245,.22);border-color:rgba(138,123,255,.75)}

  /* ---------- dia da compra e fechamento ---------- */
  #mespick .mp-dia{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  #mespick .mp-dia label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;color:var(--ink2)}
  #mespick .mp-dia .f{width:84px;text-align:center;border-color:var(--line2);background:var(--field)}
  #mespick .mp-dia small{display:block;margin-top:6px;font-size:11.5px;line-height:1.35;color:var(--muted)}
  .f.mesin.comdia{background-image:radial-gradient(circle,#8a7bff 2.5px,transparent 3px);background-repeat:no-repeat;background-size:8px 8px;background-position:56px 64%}
  .fech{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
  .fech .f.num{width:46px;text-align:center;padding:4px}

  /* ---------- seletor de mês ---------- */
  .f.mesin{cursor:pointer}
  #mespick{position:fixed;z-index:55;width:240px;padding:10px;border-radius:14px;background:linear-gradient(180deg,#151c48,#0b1029);
           border:1px solid var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.55)}
  #mespick[hidden]{display:none}
  #mespick .mp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  #mespick .mp-h b{font-size:15px}
  #mespick button{border:0;background:none;color:var(--ink2);border-radius:9px;cursor:pointer;font:inherit;font-weight:600}
  #mespick .mp-nav{width:32px;height:30px;font-size:16px}
  #mespick .mp-nav:hover,#mespick .mp-g button:hover{background:var(--field-h);color:var(--ink)}
  #mespick .mp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  #mespick .mp-g button{padding:8px 0}
  #mespick .mp-g button.hoje{box-shadow:inset 0 0 0 1px var(--line2)}
  #mespick .mp-g button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:none}
  #mespick .mp-f{margin-top:8px;display:flex;justify-content:flex-end}
  #mespick .mp-f button{font-size:12.5px;color:var(--muted);padding:5px 9px}

  /* ---------- diálogo e aviso ---------- */
  dialog#dlg{border:1px solid var(--line2);border-radius:20px;padding:22px 24px;width:min(460px,calc(100vw - 32px));color:var(--ink);
             background:linear-gradient(180deg,#151c48,#0b1029);box-shadow:0 30px 90px rgba(0,0,0,.65)}
  dialog#dlg::backdrop{background:rgba(3,5,14,.66);backdrop-filter:blur(3px)}
  #dlg h3{margin:0 0 10px;font-size:18px;font-weight:800}
  #dlg p{margin:0 0 8px;color:var(--ink2)}
  #dlg ul{margin:6px 0 0;padding-left:18px;color:var(--ink2)}
  #dlg li{margin:3px 0}
  #dlg .nota{margin-top:12px;padding:9px 12px;border-radius:10px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:#fcd58a;font-size:13px}
  #dlg .f{border-color:var(--line2);background:var(--field);margin-top:6px}
  #dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  .btn.perigo{border:0;color:#fff;background:#dc4a4a;box-shadow:0 0 22px rgba(220,74,74,.35)}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:16px;
         padding:10px 10px 10px 16px;border-radius:14px;background:rgba(18,24,60,.97);border:1px solid var(--line2);box-shadow:0 16px 40px rgba(0,0,0,.5);font-weight:600}
  #toast[hidden],#tip[hidden]{display:none}
  #toast.erro{border-color:rgba(248,113,113,.5)}
  #toast button{border:0;background:rgba(91,95,245,.22);color:#c9caff;font-weight:700;padding:6px 12px;border-radius:9px;cursor:pointer}
  #toast button:hover{background:rgba(91,95,245,.38)}

  /* ---------- investimentos ---------- */
  td.v{padding-right:12px;white-space:nowrap}
  .f.tick{text-transform:uppercase;font-weight:800;letter-spacing:.03em;min-width:0;width:108px}
  .f.tick::placeholder{text-transform:none;letter-spacing:0;font-weight:500}
  tr.apbox>td{background:rgba(0,0,0,.18);padding:0}
  tr.apbox .inner{padding:10px 12px 14px 26px;border-left:3px solid rgba(91,95,245,.5)}
  table.mini th{font-size:10px}
  .btn.apb{padding:5px 10px;font-size:12.5px;white-space:nowrap}
  .btn.apb.on{background:rgba(91,95,245,.2);border-color:rgba(91,95,245,.55);color:#fff}
  .pill .dot.off{background:var(--neg);box-shadow:0 0 10px var(--neg)}
  .pill .dot.load{background:#fbbf24;box-shadow:0 0 10px #fbbf24;animation:pulsa 1s ease-in-out infinite}
  @keyframes pulsa{50%{opacity:.35}}

  .opcs{display:grid;gap:8px;margin-top:12px}
  .opc{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);cursor:pointer;background:var(--field)}
  .opc input{margin-top:3px;accent-color:var(--accent)}
  .opc b{display:block;font-size:14.5px}
  .opc small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .opc:has(input:checked){border-color:rgba(91,95,245,.7);background:rgba(91,95,245,.14)}
  .badge-moeda{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.02em;background:rgba(91,95,245,.18);color:#c9caff;border:1px solid rgba(91,95,245,.45)}
  .jgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
  @media (max-width:1100px){ .jgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }

  /* ---------- parcela recorrente ---------- */
  .ultcell{display:flex;align-items:center;gap:6px}
  .ultcell .f{flex:none}
  .f.mes{width:140px}
  .recbtn{flex:none;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .recbtn:hover{color:var(--ink);border-color:var(--line2)}
  .recbtn.on{color:#fff;background:rgba(91,95,245,.25);border-color:rgba(91,95,245,.65)}
  .recfim{display:inline-block;padding:6px 8px;color:#b4b6ff;font-weight:700;white-space:nowrap}
  tr.rec td{background:rgba(91,95,245,.07)}
  tr.rec td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

  /* ---------- calendário anual ---------- */
  table.cal{table-layout:fixed}
  table.cal th,table.cal td{padding:3px 2px;text-align:right}
  table.cal th:first-child,table.cal td:first-child{text-align:left;padding-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.cal td:first-child{font-weight:600;color:var(--ink2)}
  table.cal .f.num{width:100%;padding:5px 4px;font-size:12.5px}
  table.cal td.v{font-size:12.5px;padding-right:6px}
  table.cal th.cur{color:#b4b6ff}
  table.cal td.cur{background:rgba(91,95,245,.08)}
  table.cal td.yt{font-weight:800;font-size:12.5px;padding-left:8px}
  table.cal tr.calc td{color:var(--ink)}

  details{border-top:1px solid var(--line);padding:10px 0}
  summary{cursor:pointer;font-weight:700}
  .warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);color:#fcd58a;border-radius:12px;padding:10px 14px;margin-top:16px}
  code{background:var(--field-h);padding:1px 5px;border-radius:5px;font-size:12px}

  @media (max-width:1100px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .g-1-1{grid-template-columns:minmax(0,1fr)} }
  @media (max-width:1200px){ .g-1-2,.g-2-1{grid-template-columns:minmax(0,1fr)} }
  @media (max-width:720px){
    .shell{grid-template-columns:minmax(0,1fr);min-height:100dvh}
    /* menu vira barra embaixo, rolável de lado */
    .rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;justify-content:flex-start;gap:0;
          padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:30;
          overflow-x:auto;scrollbar-width:none;background:rgba(6,9,21,.94);backdrop-filter:blur(14px)}
    .rail::-webkit-scrollbar{display:none}
    .rail .perfil{display:none}
    .phead{position:relative}
    .phead>div:first-of-type{padding-right:46px}
    .perfil.mob{display:grid;position:absolute;top:0;right:0;width:36px;height:36px;border-radius:12px;margin:0;font-size:14px}
    .nav{flex:none;width:68px;padding:2px 0}
    .nav .ico{width:36px;height:36px}
    .nav span{font-size:10px}
    main{padding:calc(14px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}
    .phead{margin-bottom:16px;align-items:flex-start}
    .phead h1{font-size:24px}
    .phead .acts{width:100%}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .kpi{padding:12px}
    .kpi .lbl{font-size:9.5px;letter-spacing:.07em;gap:7px}
    .kpi .badge{width:24px;height:24px;border-radius:8px}
    .kpi .badge svg{width:13px;height:13px}
    .kpi .val,.kpi .val input{font-size:18px}
    .kpi .val{margin:8px 0 2px}
    .kpi .sub{font-size:11px}
    .card{padding:14px 14px;border-radius:16px}
    .ch .tot{font-size:17px}
    .ch .tot.hl{font-size:22px}
    .ch h2{flex-wrap:wrap;min-width:0}
    .ch h2>input.f.name{flex:1 1 150px;width:auto!important;min-width:0}
    .ch>div{flex-wrap:wrap}
    .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
    .seg button{flex:none}
    .f,select.f,#dlg .f{font-size:16px}          /* evita o zoom automático do iPhone ao tocar num campo */
    .kpi .val input{font-size:18px}
    #toast{bottom:calc(88px + env(safe-area-inset-bottom));max-width:calc(100vw - 24px)}
    /* tabelas viram cartões compactos: título no alto e os campos em 2 colunas,
       com o rótulo em cima e tudo alinhado à esquerda */
    .tw table:not(.cal),.tw table:not(.cal)>tbody{display:block;width:100%;max-width:none!important}
    .tw table:not(.cal)>thead,.tw table:not(.cal)>colgroup{display:none}
    .tw table:not(.cal)>tbody>tr{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 16px;align-items:start;
          border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px 14px;margin-bottom:8px;background:rgba(255,255,255,.015)}
    .tw table:not(.cal)>tbody>tr>td{display:block;min-width:0;padding:0!important;border:0;width:auto!important;max-width:none!important;text-align:left;white-space:normal;font-size:15px}
    .tw table:not(.cal)>tbody>tr>td:empty{display:none}
    .tw table:not(.cal)>tbody>tr>td[data-label]::before{content:attr(data-label);display:block;margin-bottom:5px;font-size:9.5px;font-weight:700;
          letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* valor em campo tem 4px de folga interna: o rótulo encosta mais para os dois ficarem na mesma altura */
    .tw table:not(.cal)>tbody>tr>td[data-label]:has(.f)::before{margin-bottom:1px}
    /* o texto do campo fica alinhado com o rótulo; só o fundo do campo sai um pouco para a esquerda */
    .tw table:not(.cal)>tbody>tr>td .f{margin-left:-9px;width:calc(100% + 9px)!important;min-width:0!important;max-width:none;text-align:left;padding-top:3px;padding-bottom:3px}
    .tw table:not(.cal)>tbody>tr>td .mc .mcq{margin:0;width:40px!important;text-align:center;padding:1px 4px}
    .tw table:not(.cal)>tbody>tr>td .sub2{padding:0}
    .tw table:not(.cal)>tbody>tr>td .recfim{padding:4px 0}
    .tw table:not(.cal)>tbody>tr>td .dotcell{padding-left:0}
    .tw table:not(.cal)>tbody>tr>td .dotcell .f{width:auto!important;flex:1 1 auto;margin-left:-3px}
    .tw table:not(.cal)>tbody>tr>td .meter{margin-top:6px}
    /* título do cartão: linha inteira, sem rótulo */
    .tw table:not(.cal)>tbody>tr>td.tit{grid-column:1/-1;order:-1;padding-right:34px!important;font-weight:800}
    .tw table:not(.cal)>tbody>tr>td.tit::before{display:none}
    .tw table:not(.cal)>tbody>tr>td.tit .f{font-size:16px;font-weight:700}
    .tw table:not(.cal)>tbody>tr:has(>td.ctl [data-act="up"])>td.tit{padding-right:90px!important}
    .tw table:not(.cal)>tbody>tr>td.lg,.tw table:not(.cal)>tbody>tr>td[colspan]{grid-column:1/-1}
    /* ações (↑ ↓ ✕) no canto de cima; o botão de aportes ocupa a última linha */
    .tw table:not(.cal)>tbody>tr>td.ctl{position:absolute;top:8px;right:8px}
    .tw table:not(.cal)>tbody>tr>td.ctl:has(>.apb){position:static;grid-column:1/-1}
    /* linhas sem título (aportes): o primeiro campo, a data, ocupa a linha de cima ao lado do ✕ */
    .tw table:not(.cal)>tbody>tr:not(:has(>td.tit))>td:first-child{grid-column:1/-1;padding-right:34px!important}
    .tw table:not(.cal)>tbody>tr>td input[type=date].f{width:auto!important}
    /* bolinha de cor ao lado do título */
    .tw table:not(.cal)>tbody>tr>td:has(>.sw){position:absolute;left:12px;top:18px}
    .tw table:not(.cal)>tbody>tr:has(>td>.sw)>td.tit{padding-left:32px!important}
    /* células sem rótulo (chips, etiquetas) assentam na base da linha */
    .tw table:not(.cal)>tbody>tr>td:not([data-label]):not(.tit):not(.ctl):not([colspan]){align-self:end}
    .tw table:not(.cal)>tbody>tr.tot{border-style:dashed}
    .tw table:not(.cal)>tbody>tr.rec{background:rgba(91,95,245,.07);box-shadow:inset 3px 0 0 var(--accent)}
    .tw table:not(.cal)>tbody>tr.rec>td,.tw table:not(.cal)>tbody>tr.calrow>td{background:none;box-shadow:none}
    .tw table:not(.cal)>tbody>tr.calrow{background:rgba(91,95,245,.05)}
    .tw table:not(.cal)>tbody>tr.calrow>td.tit{padding-right:84px!important}
    .tw table:not(.cal)>tbody>tr.apbox{display:block;border:0;padding:0;background:none}
    .tw table:not(.cal)>tbody>tr.apbox>td{display:block}
    tr.apbox .inner{padding:8px 6px 10px 10px}
    /* listas simples, sem cabeçalho (ganhos, tipos, classes): uma linha só, que quebra se faltar espaço */
    .tw table:not(.cal):not(:has(>thead))>tbody>tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px 8px 14px}
    .tw table:not(.cal):not(:has(>thead))>tbody>tr>td.tit{flex:1 1 80px;order:0;padding-right:0!important}
    .tw table:not(.cal):not(:has(>thead))>tbody>tr>td.ctl,.tw table:not(.cal):not(:has(>thead))>tbody>tr>td:has(>.sw){position:static}
    .tw table:not(.cal):not(:has(>thead))>tbody>tr:has(>td>.sw)>td.tit{padding-left:0!important}
    .tw table:not(.cal):not(:has(>thead))>tbody>tr>td .f.num{width:104px!important;text-align:right}
    /* parcelas: nome / tipo e cartão / valor e nº de parcelas / início e término / situação com os botões */
    .tw table.parc>tbody>tr:not(.calrow){grid-template-areas:"nome nome" "tipo cartao" "valor parc" "ini fim" "sit sit"}
    .tw table.parc>tbody>tr:not(.calrow)>td:nth-child(1){grid-area:nome}
    .tw table.parc>tbody>tr:not(.calrow)>td:nth-child(2){grid-area:tipo}
    .tw table.parc>tbody>tr:not(.calrow)>td:nth-child(3){grid-area:valor}
    .tw table.parc>tbody>tr:not(.calrow)>td:nth-child(4){grid-area:ini}
    .tw table.parc>tbody>tr:not(.calrow)>td:nth-child(5){grid-area:parc}
    .tw table.parc>tbody>tr:not(.calrow)>td:nth-child(6){grid-area:fim}
    .tw table.parc>tbody>tr:not(.calrow)>td:nth-child(7){grid-area:sit;display:flex;flex-wrap:wrap;align-items:center;column-gap:10px}
    .tw table.parc>tbody>tr:not(.calrow)>td:nth-child(7)::before{flex-basis:100%}
    .tw table.parc>tbody>tr:not(.calrow)>td:nth-child(7) .antctl{margin:0 0 0 auto;flex-wrap:nowrap}
    .tw table.parc>tbody>tr:not(.calrow)>td:nth-child(8){grid-area:cartao}
    .recbtn.so-cel{display:inline-flex}
    .recbtn.so-pc{display:none}
    .ultcell{flex-wrap:wrap}
    .f.num{width:auto;min-width:96px}
    .fech .f.num{min-width:0}
    /* calendário anual: rola de lado em vez de espremer 12 meses */
    table.cal{min-width:880px}
    .leg{min-width:0;width:100%;max-width:100%}
    .leg li{gap:8px}
    .pie-wrap{flex-direction:column;align-items:stretch}
    .pie-wrap>svg{align-self:center}
    .jgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .dlg-grid{grid-template-columns:minmax(0,1fr)}
  }
  @media (hover:none){ .rowacts{opacity:1} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<body>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main id="app"></main>
</div>
<div id="tip" role="tooltip" hidden></div>
<div id="mespick" hidden></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" hidden></div>
<input type="file" id="fileImp" accept=".json,application/json" hidden>

<script>
"use strict";
/* ============================================================
   Utilidades
   ============================================================ */
const KEY = 'planner-financeiro-v1';
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_L = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
/* paleta categórica validada para o fundo escuro (ordem fixa) */
const PALETA = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#0ca30c','#9085e9','#e66767'];
const SERIES = [
  {k:'ganhos',   label:'Ganhos',                  curto:'Ganhos',   cor:'#3987e5'},
  {k:'fixos',    label:'Gastos',                  curto:'Gastos',   cor:'#d95926'},
  {k:'primario', label:'Resultado primário',      curto:'Primário', cor:'#199e70'},
  {k:'reserva',  label:'Reserva de contingência', curto:'Reserva',  cor:'#9085e9'},
];
const uid = () => Math.random().toString(36).slice(2, 10);
const sum = a => a.reduce((x, y) => x + (Number(y) || 0), 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const brl = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const brl0 = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
const fmtIn = v => (v == null || isNaN(v)) ? '' :
  (Math.round(v * 100) / 100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:false});
const pct = v => (Number(v) || 0).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
const kfmt = v => Math.abs(v) >= 1000 ? (v / 1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + 'k' : v.toLocaleString('pt-BR', {maximumFractionDigits:0});
const sg = v => v < 0 ? 'neg' : '';

/* Aceita "1234,56", "1.234,56", "1234.56", "2.212" (milhar) e contas simples como "5,10*23". */
function parseNum(str){
  let s = String(str ?? '').trim().replace(/R\$|%/gi, '').replace(/\s/g, '');
  if (s === '') return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(/,/g, '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^[\d.+\-*/()]+$/.test(s)) return NaN;
  try { const v = Function('"use strict";return (' + s + ')')(); return (typeof v === 'number' && isFinite(v)) ? v : NaN; }
  catch (e) { return NaN; }
}
/* aceita "2026-11", "11/2026", "11/26", "nov 26", "Nov 2026", "novembro de 2026" */
function parseMes(str){
  const s = String(str ?? '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (s === '') return '';
  const ano = a => a.length === 2 ? 2000 + +a : +a;
  let m = s.match(/^(\d{4})-(\d{1,2})$/); if (m) return ym(+m[1], +m[2]);
  m = s.match(/^(\d{1,2})\s*[\/.\-]\s*(\d{2}|\d{4})$/); if (m) return ym(ano(m[2]), +m[1]);
  m = s.match(/^([a-z]{3})[a-z]*\.?\s*(?:de\s*)?[\/\-]?\s*(\d{2}|\d{4})$/);
  if (m) { const i = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'].indexOf(m[1]); if (i >= 0) return ym(ano(m[2]), i + 1); }
  return null;
}
/* "2026-11" -> "Nov 26" */
const mesAbrev = k => { if (!k) return ''; const [y, m] = k.split('-').map(Number); return `${MESES[m - 1]} ${String(y).slice(2)}`; };
const ym = (y, m) => (m >= 1 && m <= 12) ? `${y}-${String(m).padStart(2, '0')}` : null;
function addMonths(k, n){
  let [y, m] = k.split('-').map(Number); m += n;
  y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
  return ym(y, m);
}

/* ---------- Cronograma de um parcelamento ----------
   Mês a mês, a partir do início: em cada mês paga-se o número de parcelas informado no mini calendário (p.pagas[mês]);
   sem número informado, conta 1 parcela (mês fechado = paga; mês atual/futuro = prevista). Pagando 2 ou mais num mês,
   os meses finais somem: o parcelamento termina antes (fim real). Pagando 0, ele se estende. */
let memoCron = {};
function cron(p){
  if (memoCron[p.id]) return memoCron[p.id];
  if (!p.ultima) return (memoCron[p.id] = {rec:true});
  const v = Number(p.valor) || 0, atual = S.config.mesAtual, pg = p.pagas || {};
  const n = Math.max(1, Math.round(p.nParc || (p.inicio ? monthsBetween(p.inicio, p.ultima) + 1 : 1)));
  const ini = p.inicio || addMonths(p.ultima, -(n - 1));
  const meses = {}, lista = []; let resto = n, k = ini, fim = ini, guarda = 0;
  while (resto > 0 && guarda++ < 600) {
    const informado = pg[k] != null, plano = informado ? Math.max(0, Math.round(pg[k])) : 1;
    const q = Math.min(plano, resto), antes = resto;
    resto -= q;
    // mostra: quantas foram pagas (mês fechado sem número = 1; mês atual/futuro sem número = 0, ainda não paga)
    meses[k] = {antes, qtd:q, depois:resto, informado, mostra: informado ? Math.round(pg[k]) : (pagaAuto(p, k) ? 1 : 0)};
    lista.push(k);
    if (q > 0) fim = k;
    k = addMonths(k, 1);
  }
  return (memoCron[p.id] = {n, ini, fim, meses, lista, v, pago: n * v, antecipado: fim < p.ultima, atrasado: fim > p.ultima});
}

function pagamentoEm(p, k){
  if (p.inicio && k < p.inicio) return 0;
  if (!p.ultima) return Number(p.valor) || 0;
  const m = cron(p).meses[k];
  return m ? m.qtd * (Number(p.valor) || 0) : 0;
}
/* parcelas que ainda faltam no início do mês k */
function restantesEm(p, k){
  if (!p.ultima) return null;
  const c = cron(p);
  if (k > c.fim) return 0;
  if (k < c.ini) return c.n;
  return c.meses[k] ? c.meses[k].antes : 0;
}

/* ---------- Reserva: saldo de cada aplicação ----------
   Sem aportes: vale o "valor" digitado. Com aportes: saldo = aportes − resgates corrigidos dia a dia

let memoRes = {};
function serieRes(a){
  if (memoRes[a.id] !== undefined) return memoRes[a.id];
  const aps = S.resAportes.filter(x => x.ativoId === a.id && x.data).sort((x, y) => (x.data > y.data) - (x.data < y.data));
  if (!aps.length) return (memoRes[a.id] = null);
  const hoje = hojeISO(), p = (Number(a.pctCDI) || 0) / 100, cdi = (M.bcb && M.bcb.cdi) || {d:[], v:[]};
  const fluxo = {}, taxa = {};
  aps.forEach(x => { fluxo[x.data] = (fluxo[x.data] || 0) + (x.tipo === 'resgate' ? -1 : 1) * (Number(x.valor) || 0); });
  cdi.d.forEach((d, i) => { taxa[d] = cdi.v[i]; });
  const ini = aps[0].data;
  const ds = [...new Set([...Object.keys(fluxo), ...cdi.d, hoje])].filter(d => d >= ini && d <= hoje).sort();
  let saldo = 0, inv = 0; const d = [], v = [];
  for (const t of ds) {
    saldo += fluxo[t] || 0; inv += fluxo[t] || 0;
    d.push(t); v.push(saldo);                                   // saldo no início do dia t
    if (t < hoje && taxa[t] != null) saldo *= 1 + taxa[t] / 100 * p;  // rende o CDI do dia t
  }
  const semCdi = p > 0 && !cdi.d.some(x => x >= ini);

}

  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (s.d[mid] <= iso) lo = mid; else hi = mid - 1; }

/* histórico mensal da reserva: aplicações com aportes rendem pelo CDI; as sem aportes entram com o valor digitado.
   Para cada mês: saldo no fim do mês (ou hoje), aportes − resgates do mês e o rendimento do mês. */
function serieReservaMensal(){
  const com = S.reserva.ativos.filter(a => serieRes(a));
  if (!com.length) return null;
  const sem = sum(S.reserva.ativos.filter(a => !serieRes(a)).map(a => Number(a.valor) || 0));
  const ids = new Set(com.map(a => a.id)), fluxos = {};
  S.resAportes.forEach(x => { if (!x.data || !ids.has(x.ativoId)) return; const m = x.data.slice(0, 7); (fluxos[m] = fluxos[m] || []).push({data:x.data, v:(x.tipo === 'resgate' ? -1 : 1) * (Number(x.valor) || 0)}); });

  const atual = hojeYM(); let k = com.map(a => serieRes(a).ini).sort()[0].slice(0, 7);
  if (monthsBetween(k, atual) > 60) k = addMonths(atual, -60);

  for (; k <= atual; k = addMonths(k, 1)) {
    const fim = k === atual ? hojeISO() : fimDoMes(k);
    const saldoCDI = sum(com.map(a => valorResEm(a, fim)));
    const lista = fluxos[k] || [], F = sum(lista.map(f => f.v)), base = ant == null ? 0 : ant;

    out.push({k, saldo: saldoCDI + sem, aportes: F, ganho, r: denom > 0 ? ganho / denom * 100 : 0});

}

function resolver(it, base){
  if (it.modo === 'pct') { const p = Number(it.pct) || 0; return {v: base * p / 100, p}; }
  const v = Number(it.valor) || 0; return {v, p: base ? v / base * 100 : 0};

function calc(mes = S.config.mesAtual){
  const arrec = sum(S.ganhos.map(g => g.valor));
  let acima = 0;
  const fixos = S.fixos.map(it => {
    const base = it.base === 'acima' ? arrec - acima : arrec;
    let r;
    if (it.auto === 'divida') { const v = totalDivida(mes); r = {v, p: base ? v / base * 100 : 0}; }
    else r = resolver(it, base);
    acima += r.v;

  const totalFixos = sum(fixos.map(f => f.v));
  const impostos = sum(fixos.filter(f => f.it.imposto).map(f => f.v));
  const liquido = arrec - impostos;
  const primario = arrec - totalFixos;
  const fundos = S.fundos.map(it => ({it, ...resolver(it, primario)}));
  const totalFundos = sum(fundos.map(f => f.v));
  const superavit = primario - totalFundos;
  const caixa = S.caixa.map(it => it.tipo === 'renda' ? {it, v: Number(it.valor) || 0, p: null} : {it, ...resolver(it, superavit)});

  const aportes = sum(caixa.filter(c => c.it.tipo === 'aporte').map(c => c.v));
  const totalCaixa = superavit + rendas - gastos - aportes;

  const usado = totalDivida(mes);
  return {mes, arrec, fixos, totalFixos, impostos, liquido, primario, fundos, totalFundos, superavit,

}

async function baixar(sym, range){
  let r;
  const url = urlCotacao(sym, range);
  if (!url) { const er = new Error('sem serviço'); er.offline = true; er.semServico = true; throw er; }
  try { r = await fetch(url); }
  catch (e) { const er = new Error('offline'); er.offline = true; throw er; }
  const j = await r.json().catch(() => null);
  const res = j && j.chart && j.chart.result && j.chart.result[0];
  if (!r.ok || !res) {
    const er = new Error((j && j.chart && j.chart.error && j.chart.error.description) || (j && j.erro) || 'HTTP ' + r.status);
    er.offline = !(j && j.chart);   // resposta que não veio do provedor = servidor ausente ou sem internet
    throw er;
  }
  const meta = res.meta || {}, off = meta.gmtoffset || 0, ts = res.timestamp || [];
  const cl = (((res.indicators || {}).quote || [])[0] || {}).close || [];
  const d = [], c = [];
  ts.forEach((t, i) => {
    const v = cl[i]; if (v == null) return;
    const iso = new Date((t + off) * 1000).toISOString().slice(0, 10);
    if (d.length && d[d.length - 1] === iso) c[c.length - 1] = v; else { d.push(iso); c.push(v); }
  });
  M.q[sym] = {preco: meta.regularMarketPrice ?? c[c.length - 1] ?? null, moeda: meta.currency || 'BRL',
              nome: meta.longName || meta.shortName || sym, ts: Date.now(), range, d, c};
  delete M.erros[sym];
}

const primeiraData = () => S.aportes.map(a => a.data).filter(Boolean).sort()[0] || null;
function rangePara(iso){
  const dias = (Date.now() - new Date(iso + 'T12:00:00').getTime()) / 864e5 + 10;
  return dias <= 31 ? '1mo' : dias <= 92 ? '3mo' : dias <= 183 ? '6mo' : dias <= 366 ? '1y' : dias <= 731 ? '2y' : dias <= 1826 ? '5y' : dias <= 3652 ? '10y' : 'max';
}

async function atualizarCotacoes(forcar = false){
  if (mkt.carregando) return;
  const syms = [...new Set(S.invAtivos.filter(a => !ehManual(a)).map(simbolo).filter(Boolean))];
  const range = rangePara(primeiraData() || hojeISO());
  const precisa = s => forcar ? true : (M.erros[s] ? false : !M.q[s] || Date.now() - M.q[s].ts > 15 * 60e3 || RANGES.indexOf(M.q[s].range) < RANGES.indexOf(range));
  const fxDe = () => [...new Set(syms.map(s => (M.q[s] || {}).moeda).filter(m => m && m !== 'BRL').map(m => m + 'BRL=X'))];
  const primeira = [...new Set([...syms, ...MOEDAS_BASE, IDX.sp.sym, IDX.ibov.sym, ...fxDe()])].filter(precisa);
  if (!primeira.length) return;
  mkt.carregando = true; mkt.tentativa = Date.now(); agendarFundo();
  let offline = false;
  mkt.semServico = false;
  const rodar = l => Promise.all(l.map(s => baixar(s, range).catch(e => { if (e.semServico) mkt.semServico = true; if (e.offline) offline = true; else M.erros[s] = e.message; })));
  await rodar(primeira);
  const fx = fxDe().filter(s => !primeira.includes(s) && precisa(s));
  if (!offline && fx.length) await rodar(fx);
  mkt.carregando = false; mkt.offline = offline;
  if (!offline) M.ultima = Date.now();
  salvarMkt(); agendarFundo();
}

const juros = {carregando:false, offline:false, tentativa:0};

/* ============================================================
   Investimentos: aportes, posição, valor e rendimento
   ============================================================ */
/* um aporte guarda o que foi digitado (valor OU quantidade, e o preço se for manual); o resto é calculado */
/* na carteira em bitcoin o aporte é informado em BTC ou no valor pago em R$/US$ (moedaPg) */
const pagaEmFiat = a => refDe(a) === 'BTC';
function apCalc(ap, a){
  const val = Number(ap.valor) || 0, q = Number(ap.qtd) || 0;
  if (ehManual(a)) return {valor: val, qtd: null, preco: null, moeda: 'BRL'};
  const data = ap.data || hojeISO();
  let moeda = moedaDe(a), auto = precoEm(simbolo(a), data);
  if (pagaEmFiat(a)) {
    const mp = ap.moedaPg || 'BRL';
    if (mp !== moeda) { const de = fxEm(moeda, data), para = fxEm(mp, data); auto = auto != null && de != null && para ? auto * de / para : null; }
    moeda = mp;
  }
  const preco = ap.precoAuto === false ? (Number(ap.preco) || null) : auto;
  if (ap.fixo === 'qtd') return {qtd: q, preco, valor: preco != null ? q * preco : null, moeda};
  return {valor: val, preco, qtd: preco ? val / preco : null, moeda};
}
const aportesDe = id => S.aportes.filter(x => x.ativoId === id && x.data).sort((x, y) => (x.data > y.data) - (x.data < y.data));
const fxOu1 = (moeda, iso) => fxEm(moeda, iso) ?? fxEm(moeda, hojeISO()) ?? 1;

/* posição até uma data (ou hoje): quantidade, custo em R$ (preço médio) e valor */
const carteiraDe = a => S.carteiras.find(c => c.id === a.carteiraId) || {};
const refDe = a => carteiraDe(a).moeda || 'BRL';
/* rendimento da carteira em bitcoin é medido em reais (em BTC seria sempre 0%) */
const rendRef = m => m === 'BTC' ? 'BRL' : (m || 'BRL');
const MOEDAS_CART = [['BRL', 'R$ Real'], ['USD', 'US$ Dólar'], ['BTC', '₿ Bitcoin']];
function fmtM(v, moeda = 'BRL'){
  if (v == null || isNaN(v)) return '—';
  if (moeda === 'BTC') return '₿ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:4, maximumFractionDigits:8});
  if (moeda === 'BRL') return brl(v);
  return v.toLocaleString('pt-BR', {style:'currency', currency:moeda});
}
const fmtMS = (v, moeda) => v == null || isNaN(v) ? '—' : (v > 0 ? '+ ' : v < 0 ? '− ' : '') + fmtM(Math.abs(v), moeda);

/* custo/valor em R$ e também na moeda da carteira (convertido pelo câmbio do dia de cada aporte e pelo de hoje) */
function posicao(a, ate = null){
  const manual = ehManual(a), moeda = moedaDe(a), sym = manual ? '' : simbolo(a), ref = refDe(a);
  let qtd = 0, custo = 0, custoMoeda = 0, custoC = 0, semFx = false;
  for (const ap of aportesDe(a.id)) {
    if (ate && ap.data > ate) break;
    const c = apCalc(ap, a); if (c.valor == null) continue;
    const vBRL = c.valor * fxOu1(c.moeda || moeda, ap.data), fxR = fxEm(ref, ap.data);
    if (fxR == null) semFx = true;
    const vC = fxR ? vBRL / fxR : 0;
    if (ap.tipo === 'venda') {
      if (manual) { custo = Math.max(0, custo - vBRL); custoC = Math.max(0, custoC - vC); continue; }
      const f = qtd > 0 ? Math.min(1, (c.qtd || 0) / qtd) : 0;
      custo -= custo * f; custoMoeda -= custoMoeda * f; custoC -= custoC * f; qtd = Math.max(0, qtd - (c.qtd || 0));
    } else { qtd += c.qtd || 0; custo += vBRL; custoMoeda += vBRL / fxOu1(moeda, ap.data); custoC += vC; }
  }
  let atual;
  if (manual) atual = (!ate && a.valorManual != null) ? Number(a.valorManual) : custo;
  else {
    const p = ate ? precoEm(sym, ate) : (M.q[sym] || {}).preco, fx = fxEm(moeda, ate || hojeISO());
    atual = p != null && fx != null ? qtd * p * fx : null;
  }
  const fxHoje = fxEm(ref, ate || hojeISO());
  const atualC = atual != null && fxHoje ? atual / fxHoje : null;
  return {manual, moeda, ref, qtd, custo, precoMedio: qtd ? custoMoeda / qtd : null, preco: manual ? null : ((M.q[sym] || {}).preco ?? null), atual,
          custoC: semFx ? null : custoC, atualC};
}
/* valor de um conjunto de ativos numa data; renda fixa manual: ganho distribuído linearmente desde o 1º aporte */
function valorEm(ativos, iso){
  const hoje = hojeISO();
  return sum(ativos.map(a => {
    const p = posicao(a, iso);
    if (!p.manual) return p.atual ?? p.custo;
    if (iso >= hoje) return posicao(a).atual;
    const tot = posicao(a), ganho = tot.atual - tot.custo, t0 = (aportesDe(a.id)[0] || {}).data;
    if (!t0 || !ganho) return p.custo;
    const fr = Math.max(0, Math.min(1, (new Date(iso) - new Date(t0)) / Math.max(1, new Date(hoje) - new Date(t0))));
    return p.custo + ganho * fr;
  }));
}
/* rentabilidade ponderada no tempo (desconta os aportes), dia a dia, desde o 1º aporte, medida na moeda "ref" */
function serieRendimento(ativos, ref = 'BRL'){
  const aps = []; ativos.forEach(a => aportesDe(a.id).forEach(ap => aps.push({a, ap})));
  if (!aps.length) return null;
  const hoje = hojeISO(), inicio = aps.map(x => x.ap.data).sort()[0];
  const datas = new Set([hoje]); aps.forEach(x => datas.add(x.ap.data));
  const syms = new Set(ativos.filter(a => !ehManual(a)).map(simbolo));
  syms.forEach(s => ((M.q[s] || {}).d || []).forEach(d => { if (d >= inicio && d <= hoje) datas.add(d); }));
  const ds = [...datas].filter(d => d >= inicio && d <= hoje).sort();
  const fluxo = {};
  aps.forEach(({a, ap}) => {
    const c = apCalc(ap, a); if (c.valor == null) return;
    const fxR = fxEm(ref, ap.data) || 1;
    const v = c.valor * fxOu1(c.moeda || moedaDe(a), ap.data) / fxR;
    fluxo[ap.data] = (fluxo[ap.data] || 0) + (ap.tipo === 'venda' ? -v : v);
  });
  let idx = 1, ant = 0, inv = 0; const out = [];
  for (const d of ds) {
    const fxR = fxEm(ref, d); if (!fxR) continue;
    const V = valorEm(ativos, d) / fxR, F = fluxo[d] || 0;
    let r = ant > 0 ? (V - F) / ant - 1 : (F > 0 ? V / F - 1 : 0);
    if (!isFinite(r)) r = 0;
    idx *= 1 + r; ant = V; inv += F;
    out.push({d, V, idx, inv});
  }
  return out;
}

/* ============================================================
   Patrimônio
   ============================================================ */
const totalBens = (k = null) => sum(S.bens.filter(b => !k || !b.mes || b.mes <= k).map(b => b.valor));
/* saldo devedor no início do mês k; recorrentes contam 1 mês (ou ficam de fora na projeção) */
function saldoDevedorEm(k, {cartaoId = null, recorrentes = true} = {}){
  return sum(S.parcelas.filter(p => !cartaoId || p.cartaoId === cartaoId).map(p => {
    const v = Number(p.valor) || 0;
    if (p.inicio && k < p.inicio) return 0;   // antes da 1ª parcela essa dívida não existia (só conta o que foi informado)
    if (!p.ultima) return recorrentes ? v : 0;
    return v * restantesEm(p, k);             // parcelas que ainda faltam (já desconta as antecipadas)
  }));
}
/* saldo de uma parcela no início do mês k (recorrente: 1 mês) */
const saldoParcelaEm = (p, k) => (p.inicio && k < p.inicio) ? 0 : !p.ultima ? (Number(p.valor) || 0) : (Number(p.valor) || 0) * restantesEm(p, k);
const valorInvestimentos = () => valorEm(S.invAtivos, hojeISO());
function reservaAte(k){
  let v = null;
  Object.keys(S.anual.real).sort().forEach(m => { if (m <= k && S.anual.real[m].reserva != null) v = S.anual.real[m].reserva; });
  return v ?? 0;
}
function patrimonioEm(k){
  const atual = k >= S.config.mesAtual, snap = !atual && S.patrimonioHist[k];
  const reserva = snap ? snap.reserva : atual ? reservaTotal() : reservaAte(k);
  const invest = snap ? snap.invest : atual ? valorInvestimentos() : valorEm(S.invAtivos, fimDoMes(k));
  const bens = snap ? snap.bens : totalBens(k);
  const divida = snap ? snap.divida : saldoDevedorEm(k);
  const ativos = reserva + invest + bens;
  return {k, reserva, invest, bens, divida, ativos, pl: ativos - divida};
}
/* rentabilidade mensal de tudo que rende (investimentos + aplicações da reserva com aportes).
   Método de Dietz: ganho do mês ÷ (valor no início + aportes pesados pelos dias que ficaram aplicados no mês),
   para que dinheiro novo não conte como ganho. */
function rentabilidadeMensal(){
  const resA = S.reserva.ativos.filter(a => serieRes(a)), resIds = new Set(resA.map(a => a.id));
  const fluxos = {}, datas = [];
  const add = (data, v) => { const m = data.slice(0, 7); (fluxos[m] = fluxos[m] || []).push({data, v}); datas.push(data); };
  S.aportes.forEach(ap => {
    const a = S.invAtivos.find(x => x.id === ap.ativoId); if (!a || !ap.data) return;
    const c = apCalc(ap, a); if (c.valor == null) return;
    const v = c.valor * fxOu1(c.moeda || moedaDe(a), ap.data);
    add(ap.data, ap.tipo === 'venda' ? -v : v);
  });
  S.resAportes.forEach(x => {
    if (!x.data || !resIds.has(x.ativoId)) return;
    add(x.data, (x.tipo === 'resgate' ? -1 : 1) * (Number(x.valor) || 0));
  });
  if (!datas.length) return [];
  datas.sort();
  const atual = hojeYM(), primeiro = datas[0].slice(0, 7), dia = iso => new Date(iso + 'T12:00:00').getTime() / 864e5;
  let k = monthsBetween(primeiro, atual) > 36 ? addMonths(atual, -36) : primeiro;
  const V = iso => valorEm(S.invAtivos, iso) + sum(resA.map(a => valorResEm(a, iso)));
  let ant = k > primeiro ? V(fimDoMes(addMonths(k, -1))) : 0, acum = 1;
  const out = [];
  for (; k <= atual; k = addMonths(k, 1)) {
    const fim = k === atual ? hojeISO() : fimDoMes(k), Vk = V(fim);
    const ini = dia(k + '-01') - 1, D = Math.max(1, dia(fim) - ini);
    const lista = fluxos[k] || [], F = sum(lista.map(f => f.v));
    const pesado = sum(lista.map(f => f.v * Math.max(0, Math.min(1, (dia(fim) - dia(f.data) + 1) / D))));
    const ganho = Vk - ant - F, base = ant + pesado, r = base > 0 ? ganho / base : 0;
    acum *= 1 + r;
    out.push({k, r: r * 100, acum: (acum - 1) * 100, ganho, V: Vk});
    ant = Vk;
  }
  return out;
}
function mesesPatrimonio(){
  const atual = S.config.mesAtual, c = [atual];
  Object.keys(S.anual.real).forEach(k => { if (S.anual.real[k].reserva != null) c.push(k); });
  Object.keys(S.patrimonioHist).forEach(k => c.push(k));
  const pd = primeiraData(); if (pd) c.push(pd.slice(0, 7));
  S.bens.forEach(b => { if (b.mes) c.push(b.mes); });
  let ini = c.filter(k => k <= atual).sort()[0];
  if (monthsBetween(ini, atual) > 36) ini = addMonths(atual, -36);
  const out = []; for (let k = ini; k <= atual; k = addMonths(k, 1)) out.push(k);
  return out;
}

/* até 8 casas para quantidades fracionadas (cripto, ações americanas) */
const fmtQ = v => (v == null || isNaN(v)) ? '' : (Math.round(v * 1e8) / 1e8).toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:8, useGrouping:false});

  `<input class="f mesin ${cls}${compra ? ' comdia' : ''}" type="text" data-set="${set}" data-mes="${esc(val || '')}"${opcional ? ' data-opcional="1"' : ''}${cartao ? ` data-dia="1" data-compra="${esc(compra || '')}" data-cartao="${esc(cartao.nome)}" data-fech="${cartao.fechamento || ''}"` : ''} value="${esc(mesAbrev(val))}" placeholder="${opcional ? 'opcional' : 'Mês'}" autocomplete="off" style="width:${w}px">`;
/* em que fatura cai uma compra: a partir do dia de fechamento do cartão, vai para a fatura do mês seguinte */
function faturaDaCompra(cartaoId, iso){
  const k = S.cartoes.find(x => x.id === cartaoId), F = k && Number(k.fechamento);
  const [y, m, d] = iso.split('-').map(Number), base = ym(y, m);

}
/* vencimento da fatura do mês k (o mês da fatura é o mês em que ela fecha; se o vencimento é antes do fechamento, vence no mês seguinte) */
function vencimentoISO(cartaoId, k){
  const c = S.cartoes.find(x => x.id === cartaoId) || {}, V = Number(c.vencimento), F = Number(c.fechamento) || 1;
  if (!V) return fimDoMes(k);
  const mv = V >= F ? k : addMonths(k, 1), [y, m] = mv.split('-').map(Number);
  return `${mv}-${pad2(Math.min(V, new Date(y, m, 0).getDate()))}`;
}
/* a parcela do mês k já foi paga? mês anterior ao em edição, ou o vencimento da fatura já passou */
/* mês em que se paga a fatura do mês k (normalmente o próprio k) */
const mesPagamentoFatura = (c, k) => { const V = Number(c.vencimento), F = Number(c.fechamento) || 1; return !V || V >= F ? k : addMonths(k, 1); };

  if (k < S.config.mesAtual) return true;
  const c = S.cartoes.find(x => x.id === p.cartaoId);
  if (c) { const ex = ((S.contasPagas || {})[mesPagamentoFatura(c, k)] || {})['cartao:' + c.id]; if (ex != null) return ex; }
  return hojeISO() >= vencimentoISO(p.cartaoId, k);
};
/* qual fatura de um cartão é paga no mês X (normalmente a do próprio mês) */

  return !V || V >= F ? X : addMonths(X, -1);
}

let CH = {}, chN = 0;
function chartSlot(fn, h){ const id = 'c' + (chN++); CH[id] = {fn, h}; return `<div class="chart" data-chart="${id}" style="height:${h}px"></div>`; }
function drawCharts(){ app.querySelectorAll('[data-chart]').forEach(el => { const c = CH[el.dataset.chart]; if (c) el.innerHTML = c.fn(el.clientWidth, c.h); }); }

function niceTicks(lo, hi, n = 4){
  if (hi === lo) hi = lo + 1;
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const st = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const a = Math.floor(lo / st) * st, b = Math.ceil(hi / st) * st, out = [];
  for (let v = a; v <= b + st / 2; v += st) out.push(Math.round(v * 100) / 100);
  return out;
}

/* linhas: series [{label, cor, valores, tracejada}] ; ref {valor, label} ; tip(i) -> html */
function lineSVG(w, h, {labels, series, ref, tip, rotuloFim = false, yfmt = kfmt, pontos = true}){
  const vals = series.flatMap(s => s.valores).filter(v => v != null);
  if (ref) vals.push(ref.valor);
  if (!vals.length) return `<div class="empty">Sem dados para mostrar ainda.</div>`;
  if (w < 460) rotuloFim = false;   // celular: rótulos ficam só na legenda
  const pl = 46, pr = rotuloFim ? 96 : ref ? (w < 460 ? 58 : 96) : 14, pt = 12, pb = 26;
  const iw = Math.max(10, w - pl - pr), ih = h - pt - pb, n = labels.length;
  const tk = niceTicks(Math.min(0, ...vals), Math.max(...vals)), lo = tk[0], hi = tk[tk.length - 1];
  const X = i => pl + (n <= 1 ? iw / 2 : i * iw / (n - 1));
  const Y = v => pt + ih - (v - lo) / (hi - lo) * ih;
  let s = `<svg class="lc" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  tk.forEach(t => { s += `<line class="${t === 0 ? 'zero' : 'grid'}" x1="${pl}" x2="${pl + iw}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ytk" x="${pl - 8}" y="${Y(t) + 4}">${yfmt(t)}</text>`; });
  const passo = Math.ceil(n / Math.max(1, Math.floor(iw / 46)));
  const mostrar = labels.map((_, i) => i).filter(i => i % passo === 0);
  if (n && mostrar[mostrar.length - 1] !== n - 1) { if (mostrar.length && X(n - 1) - X(mostrar[mostrar.length - 1]) < 42) mostrar.pop(); mostrar.push(n - 1); }
  mostrar.forEach(i => { s += `<text class="xtk" x="${X(i)}" y="${h - 6}">${esc(labels[i])}</text>`; });
  if (ref) { const y = Y(ref.valor); s += `<line class="ref" x1="${pl}" x2="${pl + iw}" y1="${y}" y2="${y}"/><text class="reflbl" x="${pl + iw + 8}" y="${y + 4}">${esc(ref.label)}</text>`; }
  const fins = [], marcas = labels.map(() => '');
  series.forEach(se => {
    let d = '', pen = false;
    se.valores.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
    s += `<path d="${d}" fill="none" stroke="${se.cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${se.tracejada ? ' stroke-dasharray="5 5" opacity=".75"' : ''}/>`;
    // marcadores só aparecem ao passar o mouse no mês; um ponto isolado (sem linha) fica sempre visível
    se.valores.forEach((v, i) => {
      if (v == null) return;
      const c = se.tracejada
        ? `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--panel)" stroke="${se.cor}" stroke-width="1.5"/>`
        : `<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="${se.cor}" stroke="var(--panel)" stroke-width="2"/>`;
      const isolado = (i === 0 || se.valores[i - 1] == null) && (i === se.valores.length - 1 || se.valores[i + 1] == null);
      if (isolado) s += c; else marcas[i] += c;
    });
    if (rotuloFim && !se.tracejada) { let i = se.valores.length - 1; while (i >= 0 && se.valores[i] == null) i--; if (i >= 0) fins.push({y: Y(se.valores[i]), x: X(i), label: se.curto || se.label, cor: se.cor}); }
  });
  // rótulos no fim das linhas, sem sobreposição
  fins.sort((a, b) => a.y - b.y);
  for (let i = 1; i < fins.length; i++) if (fins[i].y - fins[i - 1].y < 14) fins[i].y = fins[i - 1].y + 14;
  fins.forEach(f => { s += `<text class="elbl" x="${pl + iw + 10}" y="${f.y + 4}"><tspan fill="${f.cor}">●</tspan> ${esc(f.label)}</text>`; });
  labels.forEach((l, i) => {
    const x0 = i === 0 ? pl - 6 : (X(i - 1) + X(i)) / 2, x1 = i === n - 1 ? pl + iw + 6 : (X(i) + X(i + 1)) / 2;
    s += `<g class="band" data-tip="${esc(tip(i))}"><rect x="${x0}" y="${pt}" width="${Math.max(1, x1 - x0)}" height="${ih}"/><line x1="${X(i)}" x2="${X(i)}" y1="${pt}" y2="${pt + ih}"/>${marcas[i]}</g>`;
  });
  return s + '</svg>';
}

function arco(c, r0, r1, a0, a1){
  const P = (r, a) => `${(c + r * Math.cos(a)).toFixed(2)} ${(c + r * Math.sin(a)).toFixed(2)}`;
  const g = a1 - a0 > Math.PI ? 1 : 0;
  return `M${P(r1, a0)} A${r1} ${r1} 0 ${g} 1 ${P(r1, a1)} L${P(r0, a1)} A${r0} ${r0} 0 ${g} 0 ${P(r0, a0)} Z`;
}
/* rosca: itens [{label, valor, cor, extra:[[rotulo,valor]]}] */
function donutSVG(itens, {size = 220, esp = 30, titulo = 'TOTAL', total} = {}){
  const tot = sum(itens.map(i => i.valor)), c = size / 2, r1 = c - 6, r0 = r1 - esp;
  let s = `<svg class="donut" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  if (tot <= 0) s += `<circle cx="${c}" cy="${c}" r="${(r0 + r1) / 2}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${esp}"/>`;
  else {
    let a = -Math.PI / 2;
    itens.filter(i => i.valor > 0).forEach(it => {
      const fr = it.valor / tot, a1 = a + fr * 2 * Math.PI;
      const tip = tipHTML(it.label, [['Valor', brl(it.valor)], ['Participação', pct(fr * 100)], ...(it.extra || [])]);
      s += `<path class="slice" d="${arco(c, r0, r1, a, Math.min(a1, a + 2 * Math.PI - 1e-4))}" fill="${it.cor}" stroke="var(--panel)" stroke-width="2" data-tip="${esc(tip)}"/>`;
      a = a1;
    });
  }
  s += `<text class="ct1" x="${c}" y="${c - 6}">${esc(titulo)}</text><text class="ct2" x="${c}" y="${c + 18}">${esc(total ?? brl0(tot))}</text>`;
  return s + '</svg>';
}
function legenda(itens, {cor = null} = {}){
  const tot = sum(itens.map(i => i.valor));
  if (!itens.length) return '<p class="muted">Nada para mostrar.</p>';
  return `<ul class="leg">${itens.map(it => `<li data-tip="${esc(tipHTML(it.label, [['Valor', brl(it.valor)], ['Participação', pct(tot ? it.valor / tot * 100 : 0)]]))}">
      ${cor ? cor(it) : `<span class="dotc" style="--c:${esc(it.cor)}"></span>`}
      <span class="ln">${esc(it.label)}</span><span class="lv">${brl(it.valor)}</span><span class="lp">${pct(tot ? it.valor / tot * 100 : 0)}</span></li>`).join('')}</ul>`;
}
